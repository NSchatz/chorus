[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/control",
    "crates/discovery",
    "crates/sync",
    "crates/controls",
    "crates/audio",
    "crates/alsa",
    "crates/hostctl",
    "crates/hostprobe",
    "crates/audio-path",
    "crates/measure",
    "crates/server",
    "crates/client-linux",
    "crates/opus-sys",
    "crates/schedule",
    "crates/dsp",
    "crates/cec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

# Workspace lint policy (chorus goal 3). Every crate opts in with `[lints] workspace = true`.
# Unsafe code is denied by default; a crate or item that needs it (FFI, raw syscalls) allows it
# at the narrowest scope with a one-line reason, and every `unsafe` block carries a
# `// SAFETY:` comment naming the invariant it relies on.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

# Third-party dependencies (the vendored-by-pin crypto crates, ADR 0039) are
# optimised in debug and test builds too (goal 13, the tv-path ADR): the TV
# relay's end-to-end tests seal and open about 3000 ChaCha20-Poly1305
# datagrams a second, which an unoptimised build cannot keep up with on a
# shared host. chorus's own crates stay at the debug level.
[profile.dev.package."*"]
opt-level = 2

# Debug and test builds carry line tables, not full debug info (docs/decisions/0112-a-faster-gate-with-the-same-checks.md).
# A panic, a backtrace and a debugger's breakpoint still name the file and line; what goes is
# variable and type information, which nothing in the gate reads. Full debug info made about
# 85% of every test executable (a chorus-server test binary is 50 to 57 MB), and the gate builds
# about 140 of them. The code itself does not change: debug info is not an optimisation input.
[profile.dev]
debug = "line-tables-only"

# `cargo test` and nextest build with the test profile, which inherits dev; named so the setting
# is not lost if the test profile is ever given settings of its own.
[profile.test]
debug = "line-tables-only"

# The proc-macro toolchain runs only at compile time, to expand curve25519-dalek's derive macro
# (curve25519-dalek-derive), and the `"*"` rule above would optimise it like a runtime
# dependency. Unoptimised, it builds several times faster and expands the same code: what a
# macro emits does not depend on the macro's own optimisation level.
[profile.dev.package.syn]
opt-level = 0

[profile.dev.package.proc-macro2]
opt-level = 0

[profile.dev.package.quote]
opt-level = 0

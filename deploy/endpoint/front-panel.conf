# A systemd drop-in for chorus-client.service: the front panel's buttons
# (chorus-endpoint package; docs/linux-endpoint.md, "A front panel").
#
# Install it only on an endpoint with a panel:
#
#   sudo install -D -m 0644 /usr/share/doc/chorus-endpoint/examples/front-panel.conf \
#       /etc/systemd/system/chorus-client.service.d/front-panel.conf
#   sudo systemctl daemon-reload && sudo systemctl restart chorus-client
#
# and add `--front-panel /etc/chorus/front-panel.conf` to CHORUS_CLIENT_ARGS. The
# buttons arrive on an evdev device under /dev/input (the gpio-keys driver), whose
# nodes Debian's udev makes group `input`: the service joins that group and the
# input device class is opened in its device policy, read-only. That lets it read
# every input device, keyboards included, which is why this is not in the unit by
# default. The status light needs no drop-in: 70-chorus-leds.rules gives group
# `audio` its brightness when the LED's name starts with `chorus-`.
[Service]
SupplementaryGroups=input
DeviceAllow=char-input r

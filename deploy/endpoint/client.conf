# /etc/chorus/client.conf: how chorus-client.service runs this endpoint.
#
# Read by the unit as an EnvironmentFile (systemd.exec(5)); CHORUS_CLIENT_ARGS
# is one line, unquoted, split at whitespace into chorus-client's arguments. The unit adds
# `--rejoin --identity-dir /var/lib/chorus-client` itself. After an edit:
#
#   sudo systemctl restart chorus-client
#   journalctl -u chorus-client -f
#
# A dpkg conffile: an upgrade keeps your edits and asks before replacing them.
#
# What to set (`chorus-client` refuses an unknown argument by name, exit 2):
#
#   --endpoint <name>     this speaker's name; the server pins its key to it
#                         (or to --endpoint-id <id>), so keep it stable
#   --zone <zone>         the zone (room) this speaker plays
#   --discover            find the server by multicast DNS, then fall back to
#   --server <host:port>  the static address (audio port 4010); with neither,
#                         the client exits 7 and the unit tries again
#   --control <host:port> the server's control plane (port 4020): the zone's
#                         volume, mute and group, and moves between groups
#   --device <alsa-name>  the ALSA playback device (`aplay -L` lists them);
#                         `default` is the system's default card
#   --transport wireless  when this speaker's group is held to the wireless
#                         tier (config/transport.conf in the repository)
#   --front-panel <file>  the front panel's buttons and light (the controller
#                         role); copy an example from
#                         /usr/share/doc/chorus-endpoint/examples/ to
#                         /etc/chorus/front-panel.conf and install the
#                         front-panel.conf drop-in beside it (docs/linux-endpoint.md)
#   --no-delay-log        write no delay log (a sample every 100 ms grows a
#                         file for as long as the service runs); for a bench
#                         run use --delay-log /run/chorus-client/delay.log
#                         instead (a tmpfs, emptied at each restart)
#
# Real-time playout, OFF by default: add
#
#   --rt-priority 20 --rttime-us 200000
#
# to run the playout thread under SCHED_FIFO at priority 20, bounded first by
# 200 ms of real-time CPU per slice (RLIMIT_RTTIME). Both are clamped by the
# unit's LimitRTPRIO=20 and LimitRTTIME=200ms; a host that grants no priority is
# refused at start (exit 2, `stopped reason=real-time-refused`). Turn it on only
# after `chorus-verify-host` passes on this machine (docs/linux-endpoint.md).
#
# The example address is from RFC 5737's documentation range: replace it.

CHORUS_CLIENT_ARGS=--endpoint endpoint --zone default --discover --server 192.0.2.10:4010 --device default --no-delay-log

# The free-run drift baseline, recorded by the measurement harness.
#
# This file is written by `chorus-measure free-run` and is the value later runs
# cite. It is never a target: no check anywhere compares a number against a
# borrowed ppm range.
#
# `source` says what the value below IS. With `source = hardware` it is a
# MEASUREMENT of two clients running with correction disabled. With
# `source = fixture` it is NOT a measurement of anything: it is the estimator
# checked against the known rate of a committed series, and it says nothing
# whatever about any real crystal. A fixture run refuses to replace a
# hardware baseline.
#
# Format: key = value, '#' starts a comment.

source = fixture
ppm = 37.5000
half_width_ppm = 0.0000
series = fixtures/measure/10-free-run-noiseless.offsets
established_by = docs/measurements/rig3-free-run-noiseless-fixture.md
# Corrected 2026-09-30 (K48, audit A-6): the commit first written here, 60b639b, no longer
# exists in this history (a branch commit the squash merge discarded); the value below is the
# commit that first added this file and its report (the squash merge of PR #8). The value is
# synthetic (source = fixture) and is not timing evidence.
established_at_commit = ba6ca4f783bd4a89f26360a900f045a911e0b162

# The free-run drift baseline, recorded by the measurement harness.
#
# This file is written by `chorus-measure free-run` and is the value later runs
# cite. It is a MEASUREMENT, not a target: the roadmap phase that asks for it is
# explicit that the baseline is what the rig measures, and no check anywhere
# compares a number against a borrowed ppm range.
#
# `source` is load bearing. A baseline fitted from a committed fixture bounds the
# ESTIMATOR against a known rate and says nothing whatever about any real
# crystal; only `source = hardware` is a statement about two clients running with
# correction disabled.
#
# Format: key = value, '#' starts a comment.

source = fixture
ppm = 37.5000
half_width_ppm = 0.0000
series = fixtures/measure/10-free-run-noiseless.offsets
established_by = docs/measurements/rig3-free-run-noiseless-fixture.md
established_at_commit = 60b639b98586ed9e1d0bf0c195870a2bf95a1172

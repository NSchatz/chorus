# The emulator the gate boots the endpoint image on, pinned (goal 14,
# docs/decisions/0109-*). tools/qemu-env.sh installs exactly this and verifies
# what is installed against it; tools/conventions/check-pins.sh holds this file
# to exact versions and sha256 digests. An upgrade is its own commit saying why
# (docs/conventions.md, "Pins").
#
# Espressif's QEMU fork, the release ESP-IDF v6.1 itself names for the esp32s3
# machine (tools/tools.json of the pinned tree, tool `qemu-xtensa`: this
# version, URL and sha256, licence GPL-2.0-only; read 2026-10-02). It is run as
# an unmodified binary; its source is never read (docs/clean-room.md).
qemu_version = esp_develop_9.2.2_20260417
qemu_asset_url = https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
qemu_asset_sha256 = 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
# The program inside that archive, qemu/bin/qemu-system-xtensa, as extracted.
qemu_binary_sha256 = 50813d894756c1448b8742e1d8db21e3cce0f4e85b56fe53e36760b941cb7f17


<!doctype html>
<!-- The base demonstration tree's markup: it links the stylesheet and says what
     each thing IS, and it carries no style of its own. That is the property
     `styling-stays-in-the-stylesheet` holds, and it is what makes the .css files
     beside this one the whole source set the colour and length rules read. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>base</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <section class="card">
      <p>A card, painted by a rule in page.css and by nothing here.</p>
    </section>
  </body>
</html>

# pnpm 11 reads its project settings from here rather than from .npmrc, so this
# is the same statement as `ignore-scripts = true` in .npmrc, made where the
# installed pnpm looks for it. Both are committed and both are checked, because
# a control that only holds under one of the two config readers is not a
# control. It was written by `pnpm config set ignore-scripts true`.
#
# To turn lifecycle scripts back on, set this to false and put the reason on the
# comment line directly above the setting. tools/pinning-check.sh refuses a
# `false` that carries no reason, in either file.
ignoreScripts: true

# The bench report topics (K45): one line per hardware entry point.
#
# Format: `topic | entry point | required fields`, where the required fields are
# the keys the report's `## Fields` table has to carry for that topic
# (tools/bench/validate-report.sh checks them). A report is
# docs/measurements/<topic>-<date>.md, its raw data is under
# docs/measurements/raw/<topic>-<date>/, and its branch is bench/<date>-<topic>
# (a second run on the same day adds -2, -3, ... to all three).
#
# docs/bench.md is the prose for all of this.

rig3-capture           | tools/measure/capture-run.sh           | median_us p95_abs_us max_abs_us windows_used
rig3-free-run          | tools/measure/free-run-run.sh          | relative_rate_ppm half_width_ppm observations span_s client_a_observations client_b_observations
sync4-hour             | tools/sync-hour-run.sh                 | captures_analysed median_of_medians_us worst_p95_abs_us bound_us delaylog_a
embedded5-endpoint-rig | tools/endpoint-rig-run.sh              | captures_analysed median_of_medians_us produced_rate
embedded5-decode-cost  | tools/decode-cost-run.sh               | flac_frames_per_s flac_cpu_fraction opus_frames_per_s opus_cpu_fraction console_stack_free_bytes
embedded5-bringup      | tools/embedded5-bringup-run.sh         | amp_status link cycles_recovered heap_internal_min_free stack_min_free fifo_us
wifi7-wireless         | tools/wireless-characterization-run.sh | modes bound_us
product6-soak          | tools/soak-run.sh                      | soak_seconds delaylog_local
sound2-ten-minute      | tools/ten-minute-run.sh                | graded_seconds underruns delay_min_us delay_max_us delaylog
sound2-stream-end-and-loss | tools/stream-end-and-loss.sh      | checks_failed clean_end_exit lost_server_exit frames_sent frames_written
sound2-start-fill      | tools/start-fill-and-log-shape.sh      | checks_failed client_exit samples widest_gap_us start_fill_us filled_us
sound2-delay-log-shape | tools/delay-log-shape.sh               | client_exit samples graded_seconds delay_min_us delay_max_us delaylog
sound2-overflow        | tools/overflow-run.sh                  | client_exit crossings discarded_overflow config_unchanged delaylog
sound2-device-loss     | tools/device-loss-run.sh               | client_exit reason device_named

# Every unit of this repository that takes a real-time scheduling policy.
#
# `sched(7)`: "A nonblocking infinite loop in a thread scheduled under the
# SCHED_FIFO, SCHED_RR, or SCHED_DEADLINE policy can potentially block all
# other threads from accessing the CPU forever." RLIMIT_RTTIME is the bound on
# that, and it has to go on BEFORE the policy is taken: between the two calls a
# thread is real-time and unbounded, which is exactly the window the manual
# warns about.
#
# `crates/audio-path` grades three things about this file, and the test suite
# fails on any of them:
#
#   1. Every acquisition site in a unit named here applies the CPU-time bound
#      earlier in the same function.
#   2. Every acquisition site in the tree is in a unit named here. One in a
#      unit that is not is reported as unaccounted for, never quietly skipped.
#   3. Every unit named here still acquires something. A name left behind by a
#      deletion is reported rather than believed.
#
# There is no exclusion section, and that is the difference from
# `audio-path.conf`. An exclusion is a way to answer a finding by writing a
# sentence, and no sentence makes an unbounded real-time thread safe. Being on
# this list does not excuse a unit from the ordering check; it subjects it to
# one.
#
# Format: one path per line under [acquisitions]; '#' starts a comment.

[acquisitions]

# The server's half of the host contract. `take_contract_for_this_thread`
# applies RLIMIT_RTTIME and only then asks for the policy, so a thread that
# obtains one through it is already bounded when it does.
crates/server/src/hostreport.rs

# The spin binary, which exists to make the bound FIRE rather than merely be
# configured. It takes the policy directly, and it bounds itself first.
crates/server/src/bin/chorus-rt-spin.rs

# The crate that wraps both syscalls. Its own unit test asks for a policy, to
# assert the ceiling-zero refusal, and it applies the bound first like every
# other site in this tree: a committed counter-example in a test would be a
# counter-example just the same.
crates/hostctl/src/lib.rs

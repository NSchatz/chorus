# The ESP32-S3 endpoint's committed configuration.
#
# Every value the endpoint needs that is not derivable from the protocol lives
# here, for the same reason config/sync.conf exists: a check and the thing it
# checks cannot drift apart if there is one copy of the number.
#
# What each value was chosen FROM is in
# docs/decisions/0015-the-esp32-s3-endpoint.md. Two classes of value are in
# this file and they are not the same kind of thing:
#
#   - values this phase FIXED, each with a provenance in that decision record;
#   - values this phase DECLARES UNKNOWN, written as the literal word
#     `unknown`. The amplifier's register map is the whole of that class. TI's
#     datasheet is normative for it and the research pass could not extract
#     text from the PDF, so no address is invented here or anywhere in the
#     endpoint tree. `unknown` is not a placeholder that defaults to something:
#     the bring-up sequencer refuses to touch a register whose id reads
#     `unknown`, names it, and leaves the output stage in high impedance.
#
# Format: key = value, '#' starts a comment. Read by
# firmware/src/endpoint_config.c and by the shell entry points under tools/.

# --- the board -----------------------------------------------------------------
#
# Which board this configuration describes. The keys in this section, the pin
# map and the link's wiring are BOARD keys: a board profile under
# firmware/boards/ may set them and nothing else, and tools/firmware-image.sh
# lays the profile it is given over this file (docs/decisions/0057-*). The values
# here ARE the default profile, firmware/boards/brick-s3-wired.conf, and
# `make firmware-check` fails if the two ever disagree.
#
# P1 as approved at Checkpoint K (docs/proposals/P1-embedded-platform.md):
# ESP32-S3 everywhere, a W5500 on SPI with its interrupt line for the wired
# classes, native Wi-Fi for the compact speakers' Wi-Fi tier (K91). The
# reference board is P1's bought S3 + TAS5825M + W5500 board, Sonocotta's
# Esparagus Audio Brick (ESP32-S3).
#
# ASSUMED, not the owner's board: the owner's ESP32-S3 boards are not yet
# identified, so the model below is a stand-in until the Needs item it names is
# answered (brief section 0.8). The image build prints both.
board_profile = brick-s3-wired
board_model = Sonocotta Esparagus Audio Brick (ESP32-S3), TAS5825M, W5500
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report

# Flash on the board, in MB. The maker's own ESP-IDF configuration for the
# Brick S3 declares `flash_size: 8MB` (sonocotta/esparagus-media-center,
# Apache-2.0, firmware/esphome/5-audio-brick-s3/audio-brick-s3-idf.yaml at
# d5e4c58, read 2026-09-30). The image needs 2 MB or more.
board_flash_size_mb = 8

# --- the link ----------------------------------------------------------------
#
# `chorus#WIFI-7` owns the wireless tier, the power-save mode and every wireless
# timing claim, and this section is that owner arriving. A third class of value
# joins the two above here: values this file declares UNKNOWN because they are a
# fact about SOMEBODY'S HOUSE rather than about this repository. A network name
# and a network secret are exactly that, and committing either would put a
# credential in a git history that no rotation removes.

# Which transport this endpoint's link is: `wired` or `wireless`. A wired
# endpoint never brings a radio up at all, publishes no power-save mode, and has
# no wireless claim made about it. The transport a ZONE is declared with lives
# in config/transport.conf on the server's side; this is the endpoint's own link.
#
# `wired`, the default for every wired class (BRIEF section 3.2 "wired first";
# P1: a W5500 over SPI; audit A-14). The compact speakers' Wi-Fi tier is the
# board profile firmware/boards/compact-s3-wifi.conf, which sets `wireless`.
link_transport = wired

# The W5500's wiring (firmware/include/chorus/link.h). Driven only when the
# link is wired. On the reference board, from the maker's own configuration
# (audio-brick-s3-idf.yaml above, read 2026-09-30): `spi_clk_pin: GPIO12`,
# `spi_mosi_pin: GPIO11`, `spi_miso_pin: GPIO13`, `eth_cs_pin: GPIO10`,
# `eth_interrupt_pin: GPIO6`, `eth_reset_pin: GPIO5`. P1 left the Brick's INT
# routing unconfirmed; that file is the confirmation read. `none` names a line
# the board does not route. GPIO10 to GPIO13 are the SPI2 host's IO_MUX pins
# (ESP-IDF v6.1 esp_hal_gpspi/esp32s3/include/soc/spi_pins.h), so SPI2 it is.
eth_spi_host = spi2
pin_eth_sclk = 12
pin_eth_mosi = 11
pin_eth_miso = 13
pin_eth_cs = 10
pin_eth_int = 6
pin_eth_rst = 5

# The SPI clock, in MHz. ASSUMED: a conservative starting value, not measured
# here. The W5500 accepts up to 80 MHz (WIZnet, docs.wiznet.io, read
# 2026-09-30) and IO_MUX pins carry 80 MHz; the bench raises it with a report.
eth_spi_clock_mhz = 20

# How long the wired bring-up waits for an address before it reports the link
# down (and the supervisor retries). A policy value, not a measurement.
link_address_timeout_ms = 30000

# The Wi-Fi power save mode this endpoint SETS, explicitly, rather than
# inheriting. One of `none`, `min-modem` or `max-modem`, which are ESP-IDF's
# WIFI_PS_NONE, WIFI_PS_MIN_MODEM and WIFI_PS_MAX_MODEM.
#
# `none`, and the platform default is not it. The carried ESP-IDF guide says
# "The default Modem-sleep mode is WIFI_PS_MIN_MODEM", and under modem sleep
# "the delay in receiving Wi-Fi data may be the same as the DTIM cycle ... or
# the listening interval", which is a delay the AP chooses and no servo can
# correct. docs/decisions/0024-the-wireless-tier.md quotes both in full.
link_wifi_power_save = none

# Whether a non-Wi-Fi radio shares this board's time slice. Declared rather than
# probed, like board_octal_psram above, because it is a fact about the board and
# a fact a mode cannot overrule: the same guide says that in coexist mode "Wi-Fi
# will remain active only during Wi-Fi time slice, and sleep during non Wi-Fi
# time slice even if esp_wifi_set_ps(WIFI_PS_NONE) is called". `yes` here means
# the mode this endpoint sets is NOT in effect, and the wireless bound is
# withheld rather than published.
link_wifi_coexistence = no

# The network this endpoint joins, and its secret. BOTH DECLARED UNKNOWN, and
# neither is ever committed. The bring-up refuses to join while either reads
# `unknown`, names which one it is and where to set it, and reports the link
# down rather than retrying against a default; there is no default network and
# no fallback network anywhere in this tree.
link_wifi_ssid = unknown
link_wifi_secret = unknown

# The address the endpoint joins when nothing overrides it on the command line.
# A CONFIGURED value on every link: discovering the server, and provisioning
# its address with adoption, are goal 14's (brief section 18; audit A-10's
# link part). Until then a bench image is built with the server's address
# written here, never committed.
server_address = 127.0.0.1:4010

# --- reconnection ------------------------------------------------------------
#
# The supervisor never gives up and never spins. The first retry is quick
# because most outages are a server restart; the cap is what keeps a link that
# has been down for an hour from being a busy loop.
reconnect_first_backoff_ms = 100
reconnect_max_backoff_ms = 5000

# How long the graded outage-of-minutes run keeps the server down, in seconds.
# It is a real outage of real minutes against a real server process, so it
# costs this much wall clock every time firmware-check runs. That is the price
# of grading AC-4 over a socket instead of a mock, and it is committed here so
# that changing it is a deliberate act.
outage_minutes_seconds = 130

# --- I2S ---------------------------------------------------------------------
#
# 48 kHz because it is the rate the server cuts and the Linux client plays
# (config/verification.conf sample_rate_hz); a rate conversion on the endpoint
# would be a second clock domain inside the thing whose whole job is to have
# one.
i2s_sample_rate_hz = 48000

# 24-bit slots. The amplifier takes them, the server's 16-bit stream sits
# inside them left-justified, and it is the width that makes the MCLK rule
# below bite - which is the point of choosing it here rather than discovering
# it on a bench.
i2s_slot_bit_width = 24

# MCLK as a multiple of the sample rate. MUST be divisible by 3 at a 24-bit
# slot width. The carried ESP-IDF I2S reference for ESP32-S3 says so in its own
# words: "Please set the mclk_multiple to I2S_MCLK_MULTIPLE_384 while using 24
# bits data width Otherwise the sample rate might be imprecise since the BCLK
# division is not a integer". 384 is the value that reference names.
i2s_mclk_multiple = 384

# Frames per DMA buffer, and how many buffers. The carried reference also
# requires dma_frame_num to be a multiple of 3 at a 24-bit width: "when the
# data width is 24-bit ... i2s_chan_config_t::dma_frame_num,
# i2s_std_clk_config_t::mclk_multiple, and the writing buffer size should be
# the multiple of 3, otherwise the data on the line or the sample rate will be
# incorrect." 240 frames is 5 ms at 48 kHz and is divisible by 3.
i2s_dma_frame_num = 240
i2s_dma_desc_num = 6

# --- the pin map -------------------------------------------------------------
#
# Every exclusion is sourced to the carried ESP-IDF GPIO reference for
# ESP32-S3, quoted in docs/decisions/0015. The endpoint refuses to build with a
# pin the reference reserves, naming the pin and the rule it broke, so this
# block is checked rather than merely written down.
#
# The reference board's audio pins, from the maker's own configuration
# (audio-brick-s3-idf.yaml above, read 2026-09-30): `i2s_bclk_pin: GPIO14`,
# `i2s_lrclk_pin: GPIO15`, `i2s_dout_pin: GPIO16`, `tas58xx_enable_pin:
# GPIO17`, `i2c_sda_pin: GPIO8`, `i2c_scl_pin: GPIO9`. It names no MCLK pin and
# the maker's pin table (README "TAS5805M/TAS5825M DAC", the same repository)
# lists none, so MCLK is `none`: not routed out. ASSUMED that the TAS5825M
# runs from BCLK alone on this board; the register values of goal 9 and the
# bench confirm it. The MCLK multiple above still sets the S3's internal
# divider, so its rules still apply.
pin_i2s_mclk = none
pin_i2s_bclk = 14
pin_i2s_ws = 15
pin_i2s_dout = 16
pin_i2c_sda = 8
pin_i2c_scl = 9

# The amplifier's power-down / mute line. Driving it is what puts the output
# stage in high impedance without writing a register, which is why bring-up can
# reach a safe state before it knows a single address.
pin_amp_power_down = 17

# Whether this board carries octal flash or octal PSRAM. `yes` extends the
# reserved range to GPIO33 to GPIO37, per the carried GPIO reference. Declared
# rather than probed: a pin map is checked before an image exists. The
# reference board's configuration declares `psram: mode: octal` (the file
# above, read 2026-09-30).
board_octal_psram = yes

# --- PSRAM and DMA -----------------------------------------------------------
#
# The carried ESP-IDF external-RAM guide is flat about this: "DMA transaction
# descriptors cannot be placed in PSRAM." The endpoint therefore places every
# descriptor in internal RAM, and both a runtime check and a source scan say so
# rather than a comment.
dma_descriptor_placement = internal

# --- the amplifier -----------------------------------------------------------
#
# The analog gain ceiling, in dB above the part's LOWEST analog gain setting.
#
# Zero, deliberately. This is a POLICY floor and not a datasheet number: the
# register map is unread, an over-set analog gain damages a loudspeaker rather
# than failing a test, and the lowest setting the part offers is the only value
# that is safe without a measurement. Raising it is a deliberate act that wants
# a measured speaker sensitivity behind it, and the endpoint refuses to enable
# output for any requested gain above it, naming the request, this ceiling and
# this file.
amp_analog_gain_ceiling_db = 0.0

# The analog gain the endpoint actually asks for, in the same units. It has to
# be at or below the ceiling above, and the sequencer refuses before it touches
# the bus when it is not.
amp_analog_gain_db = 0.0

# The register VALUE that produces amp_analog_gain_db on this part. DECLARED
# UNKNOWN, and never derived from the dB figure: the mapping from decibels to a
# gain code is a datasheet fact and this phase reads no datasheet.
amp_analog_gain_code = unknown

# The amplifier's I2C address and every register it uses. DECLARED UNKNOWN.
#
# TI's TAS5825M datasheet is normative for all of these and the research pass
# could not extract text from it, so this phase asserts the bring-up BEHAVIOUR
# and names no address. Read them off the datasheet at bring-up and write them
# here; until then the sequencer refuses by name and starts no clock. The
# endpoint source contains no register literal at all, which
# firmware/check/endpoint_scan.c enforces.
amp_i2c_address = unknown
amp_reg_device_id = unknown
amp_reg_fault = unknown
amp_reg_analog_gain = unknown
amp_reg_state_control = unknown

# The value the device-id register answers with on a healthy part, and the
# value the fault register reads when there is no fault. Both DECLARED UNKNOWN
# for the same reason.
amp_device_id_value = unknown
amp_fault_clear_value = unknown

# --- the toolchain -----------------------------------------------------------
#
# The ESP-IDF release the image is built against. The carried references
# document the `driver/i2s_std.h` API, which exists from ESP-IDF v5.0 onward;
# they carry no version marker of their own, so the exact release whose pages
# were carried is an open question. This value is a PIN rather than a
# derivation: it is what tools/firmware-image.sh names when it refuses, and
# what it refuses a differing installed toolchain against, so that an image is
# never built by a toolchain nobody chose.
#
# Pinned to the release and its commit. P1 as approved at Checkpoint K moves the
# endpoint to ESP-IDF v6.1.x in chorus goal 6 (docs/proposals/P1-embedded-platform.md);
# v6.1 was the newest v6.1.x on 2026-09-30 (no v6.1.1 tag; the GitHub releases
# API, api.github.com/repos/espressif/esp-idf/releases, read 2026-09-30). The tag
# v6.1 is the tag object 4dc1c65503e98e9a6b4c3c5646237280ba79829b, which peels to
# the commit below: api.github.com/repos/espressif/esp-idf/git/ref/tags/v6.1 and
# .../git/tags/4dc1c65503e98e9a6b4c3c5646237280ba79829b, read 2026-09-30. The
# previous pin was v5.3.6 at 79e3454c68248bd7d881721c9b2e94561378a8ce (goal 2).
espidf_version = v6.1
espidf_commit = fff9895c82d744c7237be8847347bdd1b07c6643

# Board profile: the active two-way on the compact's three bought modules (the
# owner's decision of 2026-10-07, "Compact's modules": the Esparagus Audio Brick
# was out of stock at every seller read on 2026-10-06). Wired Ethernet, powered
# from an external 24 V adapter (docs/hardware/twoway-speaker.md, version 2).
#
# The boards are devkitc-s3-louderhat-wired's, with their facts and sources
# there: an Espressif ESP32-S3-DevKitC-1-N8R8, a Sonocotta Louder Raspberry Hat
# Plus, 1X (2.0) (one TAS5825M at 0x4C, no MCLK) and a WIZnet WIZ850io (W5500).
# Every Ethernet, I2S, I2C and power-down pin, the flash, the PSRAM and the
# status light keep that profile's numbers, so the two builds wire alike.
#
# The controls are the two-way class's (K68, docs/hardware/controls.md): a
# hidden pairing button and a rear status light, no other button and no
# microphone. The pairing button is on GPIO1, the compact's play/pause pin, to
# ground with the internal pull-up: ASSUMED, chosen by devices' plan for
# chorus-twoway-v1; chorus may move it and devices' wiring table follows.
#
# The amplifier's channel A (the HAT's CN2 pins 4 and 3) drives the woofer, the
# crossover's low branch, and channel B (pins 1 and 2) the tweeter. Which of A
# and B is the left I2S slot is not stated by the maker: ASSUMED A = left (slot
# 0), endpoint.conf's two_way_woofer_slot = 0, until a bench tone on one channel
# says, with the tweeter disconnected.
#
# ASSUMED board: bought and wired by nobody yet, against the same Needs item
# as the reference board (brief section 0.8).

board_profile = devkitc-s3-louderhat-twoway
board_model = Espressif ESP32-S3-DevKitC-1-N8R8, Sonocotta Louder Raspberry Hat Plus (TAS5825M), WIZnet WIZ850io (W5500)
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report
board_flash_size_mb = 8
board_octal_psram = yes

# The W5500 on SPI2 at the reference board's pins and clock.
link_transport = wired
eth_spi_host = spi2
eth_spi_clock_mhz = 20
pin_eth_sclk = 12
pin_eth_mosi = 11
pin_eth_miso = 13
pin_eth_cs = 10
pin_eth_int = 6
pin_eth_rst = 5

# The TAS5825M, by jumper lead to the HAT's Pi header, as on the compact.
pin_i2s_mclk = none
pin_i2s_bclk = 14
pin_i2s_ws = 15
pin_i2s_dout = 16
pin_i2c_sda = 8
pin_i2c_scl = 9
pin_amp_power_down = 17
pin_marker = none

# The hidden pairing button, to ground, internal pull-up (ASSUMED pin).
pin_button_pairing = 1

# The rear status light: one NeoPixel (Adafruit 1612), the compact's part and
# pin (ASSUMED there).
board_status_led = ws2812
pin_status_led = 47

# Board profile: the compact speaker's Wi-Fi tier (K91: "a few compact speakers
# may run on Wi-Fi ... never bonded into stereo pairs or theater sets";
# docs/decisions/0056-*).
#
# The same ESP32-S3 + TAS5825M reference board as brick-s3-wired, on the S3's
# native radio instead of the W5500. Everything else is endpoint.conf's: the
# power save mode it SETS (`none`), the credentials it declares unknown, the
# audio pins. The W5500's pins are carried and never driven on this link.
#
# ASSUMED board, for the same reason and against the same Needs item as the
# wired profile (brief section 0.8).

board_profile = compact-s3-wifi
board_model = Sonocotta Esparagus Audio Brick (ESP32-S3), TAS5825M, W5500
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report

link_transport = wireless

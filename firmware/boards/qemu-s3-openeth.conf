# Board profile: the emulator's board (goal 14; docs/decisions/0109-*).
#
# NOT A SPEAKER. This is Espressif's QEMU `esp32s3` machine, the board the gate
# boots the endpoint image on (tools/qemu-boot-run.sh) so that the store, the
# stored identity, the session and the firmware update are run as built, by the
# real second-stage bootloader, with no hardware. What the emulator gives:
# the two cores, the flash, NVS in it, octal PSRAM, the UART, a file for the
# eFuses (never written), and an OpenCores Ethernet controller on a user network. What it
# does not: I2C, I2S, the SPI the W5500 hangs on, the radio (Espressif's
# support table, cited in the decision record). So this profile's link is
# `emulated`, and it plays through nothing: no amplifier, no I2S clock and no
# playout path are brought up. Every other unit is the one a speaker runs.
#
# Nothing measured on this board is timing evidence: an emulator's clock is not
# a crystal's.
#
# `confirmed`: the board is exactly the pinned emulator (tools/qemu-pins.conf),
# so there is no owner's answer to wait on.

board_profile = qemu-s3-openeth
board_model = Espressif QEMU esp32s3 machine, OpenCores Ethernet, no amplifier
board_model_status = confirmed
board_needs_item = none

link_transport = emulated
board_audio_output = none

# board_flash_size_mb is left to endpoint.conf: the emulator's flash is a file
# of whatever size the image's own configuration names, and
# tools/qemu-boot-run.sh makes it that size.

# Board profile: the wired classes' reference board (P1 as approved at
# Checkpoint K; docs/decisions/0056-*).
#
# A board profile sets only board keys (board_*, pin_*, eth_*, link_transport)
# over firmware/config/endpoint.conf, and only keys that file carries.
# tools/firmware-image.sh embeds the profile it is given beside that file, and
# the endpoint reads both through one reader. This profile is the DEFAULT: its
# values are the ones endpoint.conf carries, and `make firmware-check` fails if
# the two ever disagree. Every value's source is cited beside it in
# endpoint.conf.
#
# ASSUMED board: the owner's own ESP32-S3 boards are not identified yet, so the
# model is P1's bought S3 + TAS5825M + W5500 reference board until the Needs
# item named below is answered (brief section 0.8).

board_profile = brick-s3-wired
board_model = Sonocotta Esparagus Audio Brick (ESP32-S3), TAS5825M, W5500
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report
board_flash_size_mb = 8
board_octal_psram = yes

# The default link for every wired class: the W5500 on SPI2 with its INT line.
link_transport = wired
eth_spi_host = spi2
eth_spi_clock_mhz = 20
pin_eth_sclk = 12
pin_eth_mosi = 11
pin_eth_miso = 13
pin_eth_cs = 10
pin_eth_int = 6
pin_eth_rst = 5

pin_i2s_mclk = none
pin_i2s_bclk = 14
pin_i2s_ws = 15
pin_i2s_dout = 16
pin_i2c_sda = 8
pin_i2c_scl = 9
pin_amp_power_down = 17

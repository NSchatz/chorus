# Board profile: the compact speaker on three bought modules (the owner's
# decision of 2026-10-06, "Separate US modules": the Esparagus Audio Brick is no
# longer available). Wired, on PoE+ through a bought splitter.
#
#   - Espressif ESP32-S3-DevKitC-1-N8R8: ESP32-S3-WROOM-1-N8R8, 8 MB quad flash,
#     8 MB octal PSRAM (Espressif's DevKitC-1 user guide v1.1, "Ordering
#     Information", read 2026-10-06).
#   - Sonocotta Louder Raspberry Hat Plus, 1X (2.0): one TAS5825M at I2C
#     address 0x4C (`dtoverlay=tas58xx,i2creg=0x4c`); on the Pi header, I2S
#     CLK, WS and DATA on BCM 18, 19 and 21, I2C DATA and CLK on BCM 2 and 3,
#     DAC PWDN on BCM 4 (header pin 7), and no MCLK line. From the maker's
#     README (sonocotta/raspberry-media-center at 3d8a3d7, "Boards Pinout",
#     "Peripheral (Louder)" and "DAC Configuration - Louder Raspberry Pi Media
#     Center and Hat", read 2026-10-06). The project is GPL-3.0: its
#     README is read, its design files are never opened (docs/clean-room.md).
#   - WIZnet WIZ850io: a W5500 with its own jack and magnetics.
#
# The Ethernet, I2S, I2C and power-down pins are the reference board's
# (endpoint.conf; brick-s3-wired), wired to these modules by jumper leads, so
# the W5500 and the amplifier run as they do there. The controls, the status
# light and the microphone are the compact class's (docs/hardware/controls.md)
# and every one of their pins is ASSUMED: devices' plan chose them from the
# DevKitC's free pins, avoiding the strapping pins, the octal PSRAM, USB, the
# UART0 console (GPIO43, GPIO44) and the board's own RGB LED (GPIO38 on v1.1,
# GPIO48 on v1.0). chorus may move any of them; devices' wiring table follows.
#
# The amplifier's channel A drives the woofer and channel B the tweeter (the
# devices repository's wiring for the build chorus-compact-v1). Which of A and
# B is the left I2S slot is not stated by the maker: ASSUMED A = left (slot 0),
# endpoint.conf's two_way_woofer_slot = 0, until a bench tone on one channel
# says.
#
# ASSUMED board: bought and wired by nobody yet, against the same Needs item
# as the reference board (brief section 0.8).

board_profile = devkitc-s3-louderhat-wired
board_model = Espressif ESP32-S3-DevKitC-1-N8R8, Sonocotta Louder Raspberry Hat Plus (TAS5825M), WIZnet WIZ850io (W5500)
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report
board_flash_size_mb = 8
board_octal_psram = yes

# The W5500 on SPI2 at the reference board's pins and clock.
link_transport = wired
eth_spi_host = spi2
eth_spi_clock_mhz = 20
pin_eth_sclk = 12
pin_eth_mosi = 11
pin_eth_miso = 13
pin_eth_cs = 10
pin_eth_int = 6
pin_eth_rst = 5

# The TAS5825M, by jumper lead to the HAT's Pi header: BCM 18, 19 and 21 (I2S
# CLK, WS, DATA), BCM 2 and 3 (I2C DATA, CLK), BCM 4 (DAC PWDN).
pin_i2s_mclk = none
pin_i2s_bclk = 14
pin_i2s_ws = 15
pin_i2s_dout = 16
pin_i2c_sda = 8
pin_i2c_scl = 9
pin_amp_power_down = 17
pin_marker = none

# Five buttons to ground, internal pull-up (ASSUMED pins).
pin_button_play_pause = 1
pin_button_volume_up = 2
pin_button_volume_down = 4
pin_button_next = 7
pin_button_previous = 18

# One NeoPixel (Adafruit 1612, WS2812B or SK6812), 5 V supply, 3.3 V data: below
# the WS2812B's 0.7 x VDD high, so ASSUMED to work, as it commonly does; else the
# pixel is fed through a diode (about 4.3 V). The pin is ASSUMED too.
board_status_led = ws2812
pin_status_led = 47

# The SPH0645LM4H (Adafruit 3421) on I2S1, SEL to ground: the left slot. Its
# supply runs through the mute switch's first pole; the second pole pulls
# GPIO21 low when muted (ASSUMED pins).
pin_mic_bclk = 40
pin_mic_ws = 39
pin_mic_din = 41
pin_mic_mute = 21

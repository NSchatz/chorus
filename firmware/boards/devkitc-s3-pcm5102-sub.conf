# Board profile: the subwoofer on three bought modules (the owner's decision of
# 2026-10-07, "DevKitC+DAC+WIZ", in the devices repository's plan for
# chorus-sub-v1: the Esparagus Audio Brick was out of stock, and its TAS5825M
# would not be used here). Wired Ethernet, powered from an external 5 V
# adapter, feeding a Dayton Audio SPA100-D plate amplifier at line level
# (docs/hardware/subwoofer.md, version 2).
#
# The boards: an Espressif ESP32-S3-DevKitC-1-N8R8 and a WIZnet WIZ850io
# (W5500), the compact's and the two-way's, with their facts and sources in
# devkitc-s3-louderhat-wired.conf; and an Adafruit 6250, a TI PCM5102A I2S DAC
# with a 2.1 V RMS line output, in place of the Louder Hat. Every Ethernet and
# I2S pin, the flash and the PSRAM keep the compact's numbers.
#
# The DAC has no control bus (firmware/include/chorus/line_dac.h, from TI's
# SLAS859C): no I2C, so both I2C pins are none and the bring-up writes no
# register and reads no fault. It makes its own clock from BCK at 64 bit clocks
# a frame (two 32-bit slots, endpoint.conf). Its MU pad (XSMT, low = soft mute,
# the outputs at ground) is wired to GPIO17, the power-down pin, held low until
# the playout writer runs. Its pads DE, FIL and FM are left at their defaults
# (no de-emphasis, the normal filter, I2S), and the normal filter's group
# delay, 22 frames (SLAS859C Table 4, p. 17), is this board's output delay.
# The subwoofer's feed (one output, the LFE role's) goes out on both I2S slots,
# so both of the amplifier's RCA inputs are driven, which its manual asks for
# full output.
#
# The controls are the subwoofer class's (K69, docs/hardware/controls.md): a
# pairing button, a status light, a level knob and a phase knob, no other
# button and no microphone. Every control pin is ASSUMED, chosen by devices'
# plan for chorus-sub-v1; chorus may move one and devices' wiring table
# follows. The pairing button is the two-way's, GPIO1 to ground with the
# internal pull-up; the knobs are linear 5 kohm potentiometers across 3.3 V,
# their wipers on GPIO2 (ADC1 channel 1) and GPIO4 (ADC1 channel 3), the
# compact's volume buttons' pins.
#
# ASSUMED board: bought and wired by nobody yet, against the same Needs item
# as the reference board (brief section 0.8).

board_profile = devkitc-s3-pcm5102-sub
board_model = Espressif ESP32-S3-DevKitC-1-N8R8, Adafruit 6250 (TI PCM5102A line DAC), WIZnet WIZ850io (W5500)
board_model_status = ASSUMED
board_needs_item = Your ESP32-S3 boards: module markings and a read-only chip report
board_flash_size_mb = 8
board_octal_psram = yes

# The PCM5102A on I2S alone, and its filter's delay.
board_audio_output = line-dac
board_output_delay_frames = 22 # PCM5102A normal filter, 22 tS, TI SLAS859C Table 4 p. 17

# The W5500 on SPI2 at the reference board's pins and clock.
link_transport = wired
eth_spi_host = spi2
eth_spi_clock_mhz = 20
pin_eth_sclk = 12
pin_eth_mosi = 11
pin_eth_miso = 13
pin_eth_cs = 10
pin_eth_int = 6
pin_eth_rst = 5

# The DAC, by jumper lead: BCK, WSEL, DIN; no MCLK, no I2C; MU on GPIO17.
pin_i2s_mclk = none
pin_i2s_bclk = 14
pin_i2s_ws = 15
pin_i2s_dout = 16
pin_i2c_sda = none
pin_i2c_scl = none
pin_amp_power_down = 17
pin_marker = none

# The pairing button, to ground, internal pull-up (ASSUMED pin).
pin_button_pairing = 1

# The level and phase knobs, on ADC1 (ASSUMED pins).
pin_knob_level = 2
pin_knob_phase = 4

# The status light: one NeoPixel (Adafruit 1612), the compact's part and pin
# (ASSUMED there).
board_status_led = ws2812
pin_status_led = 47

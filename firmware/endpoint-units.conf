# The ESP32-S3 endpoint's source tree, enumerated.
#
# The same answer, to the same question, that audio-path.conf gives about the
# Rust side: which code is the endpoint, and therefore which code the safety
# scans apply to. `firmware/check/endpoint_scan.c` grades five things about
# this file and the tree beside it, and the suite fails on any of them:
#
#   1. No listed unit reads a settable wall-clock source. A stepped clock is
#      what breaks playback, and it is the guardrail this repository has
#      carried since its first commit.
#   2. No listed unit burns an eFuse or activates an OTA image. Neither act is
#      reversible and neither is in this phase; chorus#FLEET-10 owns OTA.
#   3. No listed unit places anything in external RAM. The carried ESP-IDF
#      external-RAM guide says "DMA transaction descriptors cannot be placed in
#      PSRAM", and the endpoint tree's large buffers are DMA buffers, so the
#      rule is stated as a flat prohibition on PSRAM placement here. A future
#      legitimate PSRAM buffer arrives as a deliberate change to the rule, not
#      as a quiet attribute.
#   4. The amplifier driver names no register address: no hex literal appears
#      in firmware/src/amp.c outside its comments and strings.
#   5. The list is complete. Every .c and .h under firmware/src,
#      firmware/include and firmware/main is either listed here or excluded
#      below with a reason. A list you can shrink is not a check, and moving a
#      clock read one file down is exactly the shrink this closes.
#
# Format: one path per line under [on-path]; `path = reason` under [excluded].
# A reason is not optional, because an exclusion without one is just a shorter
# list.

[on-path]

# The wire format. Encodes, decodes and carries chunks; every timestamp it
# handles is nanoseconds from a monotonic source, by its own contract.
firmware/include/chorus/protocol.h
firmware/src/protocol.c

# The sync core: the filter, the correction law, the deterministic simulator
# and the scenario reader. Nothing in here reads a clock of any kind; every
# instant it works with is handed to it.
firmware/include/chorus/sync.h
firmware/src/sync_rng.c
firmware/src/sync_servo.c
firmware/src/sync_sim.c
firmware/src/sync_scenario.c

# The one clock reader in the endpoint. It is on the list precisely so that the
# settable-clock rule has something to be true of.
firmware/include/chorus/monotonic.h
firmware/src/monotonic.c

# The session supervisor: chunks off the wire, the time-sync exchange, and the
# rejoin that needs no human.
firmware/include/chorus/session.h
firmware/src/session.c

# What the endpoint publishes about itself, including the amplifier fault that
# must never be swallowed.
firmware/include/chorus/telemetry.h
firmware/src/telemetry.c

# The amplifier bring-up sequencer and the output stage it commands.
firmware/include/chorus/amp.h
firmware/src/amp.c

# I2S clocking, the pin map and where a DMA descriptor may live.
firmware/include/chorus/i2s.h
firmware/src/i2s.c

# The committed configuration, and the reader that turns it into the structs
# above.
firmware/include/chorus/conf.h
firmware/src/conf.c
firmware/include/chorus/endpoint_config.h
firmware/src/endpoint_config.c

# The target binding, compiled only by ESP-IDF and never by the host build.
# Listed for the strongest reason there is: this is the one place in the tree
# where an OTA call or an eFuse write would compile, so it is the one place the
# rules most need to hold. It is NOT host-gradable and this repository does not
# claim it; the criteria that grade it are AC-1 and AC-3, which are graded by
# an operator on a bench and refuse by name here.
firmware/main/app_main.c
firmware/main/esp_hal.h
firmware/main/esp_hal.c

[excluded]

# Nothing. Every unit under firmware/src, firmware/include and firmware/main is
# on the path, which is the honest answer for a tree this size: an endpoint is
# audio and timestamps almost all the way down. An exclusion added later says
# which unit and why, and the scan reads the reason as the audit it is.

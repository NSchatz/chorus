# The ESP32-S3 endpoint's source tree, enumerated.
#
# The same answer, to the same question, that audio-path.conf gives about the
# Rust side: which code is the endpoint, and therefore which code the safety
# scans apply to. `firmware/check/endpoint_scan.c` grades five things about
# this file and the tree beside it, and the suite fails on any of them:
#
#   1. No listed unit reads a settable wall-clock source. A stepped clock is
#      what breaks playback, and it is the guardrail this repository has
#      carried since its first commit.
#   2. No listed unit burns an eFuse, and none but ONE names ESP-IDF's OTA
#      calls. An eFuse is not reversible. The firmware update (goal 14) is
#      decided in firmware/src/ota.c, which names no ESP-IDF call and is graded
#      on a host against a fake flash, and bound in firmware/main/esp_ota.c,
#      the one unit the scanner allows the calls in (OTA_GLUE_UNIT in
#      endpoint_scan.c: named there, not here, so this list cannot widen it).
#      ESP-IDF's own OTA transport (esp_https_ota) is refused in every unit:
#      an image arrives only inside the endpoint's session.
#   3. No listed unit places anything in external RAM. The carried ESP-IDF
#      external-RAM guide says "DMA transaction descriptors cannot be placed in
#      PSRAM", and the endpoint tree's large buffers are DMA buffers, so the
#      rule is stated as a flat prohibition on PSRAM placement here. A future
#      legitimate PSRAM buffer arrives as a deliberate change to the rule, not
#      as a quiet attribute.
#   4. The amplifier driver names no register address: no hex literal appears
#      in firmware/src/amp.c outside its comments and strings.
#   5. The list is complete. Every .c and .h under firmware/src,
#      firmware/include and firmware/main is either listed here or excluded
#      below with a reason. A list you can shrink is not a check, and moving a
#      clock read one file down is exactly the shrink this closes.
#
# Vendored code (third_party/, goal 6) is named by directory under [vendored]
# with the reason it is in the image: every .c and .h beneath it is scanned by
# rules 1 to 3 like a listed unit, and every directory under third_party/ must
# be named there, so a vendored tree cannot join the image unscanned.
#
# Format: one path per line under [on-path]; `path = reason` under [excluded].
# A reason is not optional, because an exclusion without one is just a shorter
# list.

[on-path]

# The wire format. Encodes, decodes and carries chunks; every timestamp it
# handles is nanoseconds from a monotonic source, by its own contract.
firmware/include/chorus/protocol.h
firmware/src/protocol.c

# Protocol v2's catalog: the same frame, the messages v2 added, and the value
# rules both directions share. Every timestamp it carries is nanoseconds from
# a monotonic source, by the protocol's own contract.
firmware/include/chorus/protocol_v2.h
firmware/src/protocol_v2.c

# Protocol v2's key exchange and records: Noise XX over the PSA Crypto API.
# It reads no clock; every key is handed to it.
firmware/include/chorus/noise.h
firmware/src/noise.c

# The low-latency path's datagram layer (goal 13): the header, the AEAD over
# the PSA Crypto API, the replay window and the XOR parity FEC. It reads no
# clock; a chunk's stamp is carried, never made, here.
firmware/include/chorus/lowlat.h
firmware/src/lowlat.c

# The sync core: the filter, the correction law, the deterministic simulator
# and the scenario reader. Nothing in here reads a clock of any kind; every
# instant it works with is handed to it.
firmware/include/chorus/sync.h
firmware/src/sync_rng.c
firmware/src/sync_servo.c
firmware/src/sync_sim.c
firmware/src/sync_scenario.c

# The one clock reader in the endpoint. It is on the list precisely so that the
# settable-clock rule has something to be true of.
firmware/include/chorus/monotonic.h
firmware/src/monotonic.c

# The playout path (goal 8, audit A-9): the jitter buffer, the frames the I2S
# DMA consumed, counted in the interrupt and stamped on the monotonic clock it
# is HANDED (chorus_monotonic_now_ns on the board), and the servo they feed. It
# reads no clock of its own.
firmware/include/chorus/playout.h
firmware/src/playout.c

# The room's volume (goal 11, ADR 0074): min(ramped gain, the room's limit,
# max_volume) on every frame the playout path writes, the ramp counted in
# frames. Integer, no clock of its own.
firmware/include/chorus/volume.h
firmware/src/volume.c

# The DSP library (goal 12, docs/dsp.md), the C mirror of crates/dsp: the
# sound chain the playout path runs (room EQ, tone, loudness, speech, night,
# bass management, the two-way split, delay, the limiter). Pure: no clock, no
# allocation; every delay and look-ahead is counted in frames.
firmware/include/chorus/dsp.h
firmware/src/dsp.c

# The sound chain in the playout path (goal 12, done-when line C): what
# configures the DSP library's chain (the room's `sound`, the two-way in
# endpoint.conf, the sub knobs, the stream's layout), when it is in the path,
# and the I2S slots it reads and writes. No clock, no allocation.
firmware/include/chorus/endpoint_dsp.h
firmware/src/endpoint_dsp.c

firmware/include/chorus/controls.h
firmware/src/controls.c

# config/sync.conf as the endpoint reads it (audit A-12): the loop's constants,
# from the one file the Linux client is held to.
firmware/include/chorus/sync_conf.h
firmware/src/sync_conf.c

# The session supervisor: chunks off the wire, the time-sync exchange, and the
# rejoin that needs no human.
firmware/include/chorus/session.h
firmware/src/session.c

# The wireless bring-up: which power save mode is SET, whether the platform
# agrees, whether a coexistence mode makes the setting ineffective, and the
# refusal to join while a credential reads `unknown`. On the list for rule 1's
# sake as much as any: a bring-up that started a time service after it joined
# would be a settable wall clock on the endpoint path, and `sntp_`, `esp_sntp`
# and `esp_netif_sntp` are all on the list that forbids one.
firmware/include/chorus/wifi.h
firmware/src/wifi.c

# The link (P1, goal 8): which transport, whether the W5500's wiring is
# allowed, and the order the link is brought up in. Pure: the Ethernet
# controller and the radio are handed to it, and it reads no clock.
firmware/include/chorus/link.h
firmware/src/link.c

# What the endpoint publishes about itself, including the amplifier fault that
# must never be swallowed.
firmware/include/chorus/telemetry.h
firmware/src/telemetry.c

# The amplifier bring-up sequencer and the output stage it commands.
firmware/include/chorus/amp.h
firmware/src/amp.c

# I2S clocking, the pin map and where a DMA descriptor may live.
firmware/include/chorus/i2s.h
firmware/src/i2s.c

# The decoders for coded_chunk (FLAC and Opus): the seam the session calls and
# the two backends over the vendored libraries. Pure: no clock, no I/O.
firmware/include/chorus/codec.h
firmware/src/codec.c
firmware/src/codec_backend.h
firmware/src/codec_flac.c
firmware/src/codec_opus.c

# The serial console (audit A-13) and the decode-cost timer it runs. Every
# value a command sets is runtime only: nothing here writes flash or NVS. The
# decode-cost timer reads no clock itself; it is handed the monotonic one.
firmware/include/chorus/console.h
firmware/src/console.c
firmware/include/chorus/decode_cost.h
firmware/src/decode_cost.c
# The DSP chain's cost timer (goal 12), decode-cost's sibling: it too reads no
# clock itself and is handed the monotonic one.
firmware/include/chorus/dsp_cost.h
firmware/src/dsp_cost.c
# The firmware update's decisions (goal 14): an A/B state machine over an ops
# struct, with no ESP-IDF call, no clock of its own and no heap. Graded by
# firmware/tests/test_ota.c over a fault-injecting fake flash.
firmware/include/chorus/ota.h
firmware/src/ota.c

# The committed configuration, and the reader that turns it into the structs
# above.
firmware/include/chorus/conf.h
firmware/src/conf.c
firmware/include/chorus/endpoint_config.h
firmware/src/endpoint_config.c

# The target binding, compiled only by ESP-IDF and never by the host build.
# Listed for the strongest reason there is: this directory is the one place in
# the tree where an OTA call or an eFuse write would compile, so it is the one
# place the rules most need to hold (the OTA calls are allowed in esp_ota.c
# alone, below). It is NOT host-gradable and this repository does not
# claim it; the criteria that grade it are EMBEDDED-5's AC-1 and AC-3 and
# WIFI-7's AC-2, all of which are graded by an operator on a bench and refuse by
# name here. The radio binding joined it for WIFI-7 and is claimed no more than
# the rest of it is.
firmware/main/app_main.c
firmware/main/esp_hal.h
firmware/main/esp_hal.c
# The wired link's binding (goal 8): esp_eth, esp_netif and the pinned
# espressif/w5500 driver, claimed no more than the rest of this binding is.
firmware/main/esp_link.h
firmware/main/esp_link.c
# The console's binding to ESP-IDF's REPL (audit A-13), claimed no more than
# the rest of this directory.
firmware/main/console_esp.h
firmware/main/console_esp.c

# The playout path's binding (goal 8): its internal-RAM storage, its lock, and
# the writer task that calls i2s_channel_write. Claimed no more than the rest of
# the binding; the decisions it binds are firmware/src/playout.c's.
firmware/main/esp_playout.h
firmware/main/esp_playout.c

# The GPIO marker's binding (goal 9, ADR 0065): a GPIO and a GPTimer alarm armed
# from the I2S interrupt. Claimed no more than the rest of the binding; which
# boundary it marks, and when, is firmware/src/playout.c's.
firmware/main/esp_marker.h
firmware/main/esp_marker.c
# The firmware update's binding (goal 14): the update unit's ops over ESP-IDF's
# app_update, and its note over NVS. THE ONLY unit the scanner allows ESP-IDF's
# OTA calls in; every other rule applies to it like any other unit (no eFuse
# write, no settable clock, no external RAM, no esp_https_ota). Claimed on the
# emulator and the owner's bench, not on a host.
firmware/main/esp_ota.h
firmware/main/esp_ota.c

[excluded]

# Nothing. Every unit under firmware/src, firmware/include and firmware/main is
# on the path, which is the honest answer for a tree this size: an endpoint is
# audio and timestamps almost all the way down. An exclusion added later says
# which unit and why, and the scan reads the reason as the audit it is.

[vendored]

# FLAC decoding for coded_chunk (proposal P9): dr_flac 0.13.3, pinned in
# third_party/README.md, compiled into the image through firmware/src/codec_flac.c.
third_party/dr_flac = the FLAC decoder the endpoint image links (P9, goal 6)
# Opus decoding for coded_chunk (proposal P9): libopus 1.6.1, fixed point, the
# decoder units only; pinned in third_party/README.md.
third_party/opus = the Opus decoder the endpoint image links (P9, goal 6)

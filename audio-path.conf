# The audio or timestamp path of this repository, enumerated.
#
# This file is the answer to a question nobody can answer by watching a process
# run: which code is on the path where a stepped clock would break playback.
# `crates/audio-path` grades two things about it, and the test suite fails on
# either:
#
#   1. No unit in [on-path] reads a settable wall-clock source. The guardrail
#      this repository has carried since its first commit.
#   2. The list is complete. Every first-party unit a listed unit depends on -
#      by declaring it as a module, or by naming its crate - is either listed
#      here or excluded below with a reason. A list you can shrink is not a
#      check.
#
# A dependency is `mod x;` or a use of another workspace crate. Third-party
# dependencies are outside this by definition (the protocol crate's vendored
# crypto primitives, ADR 0039, read no clock).
#
# Format: one path per line under [on-path]; `path = reason` under [excluded].
# A reason is not optional, because an exclusion without one is just a shorter
# list.

[on-path]

# The wire format. Encodes, decodes and carries chunks; every timestamp it
# handles is nanoseconds from a monotonic source, by its own contract.
crates/protocol/src/lib.rs
crates/protocol/src/codec.rs
crates/protocol/src/message.rs
crates/protocol/src/session.rs
# Protocol v2 (goal 5): the same frames inside an encrypted session. The key
# exchange and the adoption pins handle no timestamp; the codec and session
# carry v1's chunks and time_sync unchanged, so the whole module is listed.
crates/protocol/src/v2/mod.rs
crates/protocol/src/v2/adoption.rs
crates/protocol/src/v2/catalog.rs
crates/protocol/src/v2/codec.rs
crates/protocol/src/v2/messages.rs
crates/protocol/src/v2/negotiate.rs
crates/protocol/src/v2/noise.rs
crates/protocol/src/v2/session.rs
# The low-latency path's datagram layer (goal 13): it carries chunks and
# their stamps over UDP, so it is on the path; it reads no clock.
crates/protocol/src/v2/lowlat.rs

# Ingest, chunking, and the one monotonic timeline the server stamps on.
crates/audio/src/lib.rs
crates/audio/src/chunker.rs
crates/audio/src/clock.rs
crates/audio/src/format.rs

# The audio device itself: the only unit in this repository that hands frames
# to a DAC and asks how far they are from it.
crates/alsa/src/lib.rs

# The server: PCM in, chunks stamped and put on the wire.
crates/server/src/lib.rs
crates/server/src/main.rs
crates/server/src/serve.rs
crates/server/src/source.rs

# One stream fanned out to every attached client, and the two server-side
# timestamps of the time-sync exchange. Both stamps come off the same monotonic
# timeline the chunks are stamped on; there is no other clock on this path.
crates/server/src/stream.rs

# The threads that carry a client's half of that fanout, and the one timeline
# they are handed. It reads no clock itself and it stamps nothing, but it is
# what decides which timeline a connection is served on, so a settable source
# reaching it would reach every stamp on that connection.
crates/server/src/clients.rs
# The protocol v2 session each client connection runs before any audio: the
# handshake, adoption, and the records every chunk and exchange travel in. It
# reads no clock and stamps nothing, but every frame on the connection passes
# through it.
crates/server/src/session.rs
# Goal 14: a speaker's firmware image, sent inside its own session from that
# session's reader thread, on the same outbound queue its audio is on (a
# window of chunks, never blocking). It reads no clock and stamps nothing, but
# every firmware frame on the connection is put there by it, beside the audio.
crates/server/src/firmware.rs
# Stream slots (goal 11): every group's stream cut on the one audio thread on
# one grid, and which of them each session hears. The slots read only the
# monotonic timeline the one stream did; the router decides which fanout a
# session's queue is attached to and moves it between two ticks, so it is on
# the path of every chunk a session receives. Neither reads any other clock.
crates/server/src/slots.rs
crates/server/src/router.rs
# A line-in from an endpoint (ADR 0066's source role) accepted by the server:
# its offer, its stream_format check and its upstream chunks into a bounded
# port the audio thread drains at each tick. Reads no clock; the stamps a
# line-in's chunks go out with are the slots' grid.
crates/server/src/linein.rs
# The TV relay (goal 13): receives the hub's datagrams, restamps each chunk
# play_at = capture stamp + lead and sends it on to the room's players. Reads
# the server's monotonic timeline only (the playout point, the offer
# timeouts); no wall clock.
crates/server/src/tvrelay.rs
# The visualizer analysis (goal 12, docs/visualizer.md): run on the audio
# thread over what each watched slot played, after the tick's broadcast. Pure
# arithmetic on the samples it is handed; it reads no clock, and the instants
# it names are sample indices the slots map onto their grid.
crates/dsp/src/visualizer.rs

# The client: chunks off the wire, buffered, written to the device.
crates/client-linux/src/lib.rs
crates/client-linux/src/main.rs
crates/client-linux/src/buffer.rs
crates/client-linux/src/receive.rs
crates/client-linux/src/run.rs
crates/client-linux/src/sink.rs
# The endpoint's side of the v2 session: every chunk and every time-sync reply
# is read through it, and every request written through it. No clock.
crates/client-linux/src/session.rs
crates/client-linux/src/decode.rs
crates/client-linux/src/coded.rs
crates/opus-sys/src/lib.rs
# The source role (goal 10, K65): a line-in captured and sent upstream, each
# chunk stamped at its capture instant on the monotonic timeline and mapped
# through the sync offset. No settable clock.
crates/client-linux/src/source.rs
# A TV input's front end and rate matcher (goal 13): the IEC 61937 scan, the
# lock and range checks, the DLL on the period timestamps and the ratio loop
# that stamps the rate-matched output on the server timeline. Pure: they read
# no clock at all; every instant is handed in by the source role, from the
# monotonic timeline.
crates/client-linux/src/tvcapture.rs
crates/client-linux/src/ratematch.rs
# The TV path's low-latency stream on a wired player (goal 13): UDP receive,
# the FEC, the jitter buffer keyed by stamp and the concealment. It reads no
# clock: the instant a frame is heard is handed in by the playout loop, from
# the monotonic timeline and the sync offset.
crates/client-linux/src/lowlat.rs

# The zone's volume and mute, applied to the PCM at the last point before the
# sink, and the one atomic the playout loop reads to know what to multiply by.
# This is on the path in the strictest sense: it is the only thing in this
# repository that changes what a sample IS rather than when it is audible.
crates/client-linux/src/zone.rs
# The output map (goal 10): remaps stream channels onto device channels at the
# sink's edge, with per-channel gain and a delay counted in frames; no clock.
crates/client-linux/src/outmap.rs
# The endpoint's sound chain at the sink's edge (goal 12): crates/dsp's chain
# run over the stream, the room gain inside it, then the output map or the
# two-way's drivers; its look-ahead is counted in frames and added to the
# device delay the sync loop reads. No clock.
crates/client-linux/src/dsp.rs
crates/client-linux/src/control.rs

# The front panel (docs/decisions/0067-*): the endpoint's buttons and status
# LED as the controller role. It runs on its own threads, never the playout
# loop's, but it stamps every key event it reads with the MONOTONIC timeline,
# never the event's own kernel time, and the model it feeds dates every action
# from those stamps, so a settable source reaching either would date a press.
crates/client-linux/src/front_panel.rs
crates/controls/src/lib.rs
crates/controls/src/model.rs
crates/controls/src/led.rs

# The TV's power as HDMI-CEC sees it (goal 13, docs/cec.md): the source role
# reads it once per captured chunk to decide the TV input's offered signal
# (crates/cec/src/power.rs, `TvSignal`). Atomics and a rule; no clock of any
# kind. The crate root is listed because the source role names the crate;
# the rest of the crate is excluded below.
crates/cec/src/lib.rs
crates/cec/src/power.rs

# The control catalog's arithmetic and its reader. `Volume` is what the unit
# above multiplies by, and the JSON reader is what turns a state message into
# one, on the endpoint's own control thread. Neither reads a clock of any kind;
# they are here because a settable source reaching either would reach the gain
# the audio path applies.
crates/control/src/lib.rs
crates/control/src/catalog.rs
crates/control/src/json.rs
# Goal 13: a room's A/V trim and the TV relay's stamp-lead rule
# (`tv_play_at_lead_ns`), integer nanoseconds in and out. The relay calls it on
# every stamp it writes, so it is on the timestamp path; it reads no clock.
crates/control/src/theater.rs
# Goal 14: the staged firmware images and what each speaker runs, in the
# catalog's words. Strings only; a session reader updates them as its
# speaker's firmware_status arrives, and they read no clock.
crates/control/src/firmware.rs

# The sync loop: the exchange, the minimum-round-trip filter, the error signal
# read at the DAC, and turning a correction into frames. This is the timestamp
# path in the strictest sense - every number it handles is nanoseconds from a
# monotonic source, and a stepped clock here is a step in the playout.
crates/client-linux/src/sync.rs
# The free-run offsets series writer (audit A-4): monotonic-derived observations only.
crates/client-linux/src/offsets.rs
# The playout thread's opt-in real-time policy (the Linux endpoint package): the
# CPU-time bound, then SCHED_FIFO through chorus_hostctl, taken and left around
# the playout loop in run.rs. Reads no clock.
crates/client-linux/src/realtime.rs

# The correction law the loop drives, and the ranges its gains and limits are
# checked against. A pure library: it reads no clock, opens no socket and
# spawns no thread, which is why it can be regression-tested against modelled
# clocks and still be the code that runs on the real path.
crates/sync/src/lib.rs
crates/sync/src/servo.rs
crates/sync/src/config.rs
# The latency-growth plan (goal 11, ADR 0071): computes the play-at stamps a
# line-in's chunks carry while its latency grows; the server will call it on the
# path. Arithmetic on stamps it is handed; it reads no clock.
crates/sync/src/latency_grow.rs

# The measurement harness. A timestamp path rather than an audio one, and the
# same rule applies for the same reason: it derives a rate in parts per million
# from elapsed time, and a clock that can be stepped would put a jump in the
# middle of a straight line and be read as drift. The whole crate is here except
# the report writer, which is excluded below.
crates/measure/src/lib.rs
crates/measure/src/capture.rs
crates/measure/src/chirp.rs
crates/measure/src/config.rs
crates/measure/src/fixtures.rs
crates/measure/src/freerun.rs
crates/measure/src/jitter.rs
crates/measure/src/lag.rs
crates/measure/src/pair.rs
crates/measure/src/rate.rs
crates/measure/src/rng.rs
crates/measure/src/wav.rs
crates/measure/src/bin/chorus-measure.rs
crates/measure/src/bin/chorus-measure-capture.rs

# The host wakeup-jitter probe (goal 7, K34). Not the audio path itself: it is
# the measurement of how late an audio-like thread wakes, and a stepped clock
# inside it would be read as a late wakeup. So it is held to the same rule: its
# only clock is CLOCK_MONOTONIC, through crates/hostprobe/src/sys.rs.
crates/hostprobe/src/lib.rs
crates/hostprobe/src/sys.rs
crates/hostprobe/src/wakeup.rs
crates/hostprobe/src/histogram.rs
crates/hostprobe/src/bin/chorus-wakeup-probe.rs
# The LAN loss probe (goal 13): monotonic stamps only, through sys.rs.
crates/hostprobe/src/udploss.rs
crates/hostprobe/src/bin/chorus-udp-loss.rs

# The DSP library (goal 12, docs/dsp.md): the endpoint's sound chain, which
# changes what a sample is (tone, loudness, bass management, the two-way
# split, delay in whole frames, the limiter). Pure: no clock of any kind, no
# I/O; its delays and look-ahead are counted in frames.
crates/dsp/src/lib.rs
crates/dsp/src/biquad.rs
crates/dsp/src/chain.rs
crates/dsp/src/compressor.rs
crates/dsp/src/crossover.rs
crates/dsp/src/delay.rs
crates/dsp/src/fixture.rs
crates/dsp/src/limiter.rs
crates/dsp/src/loudness.rs
crates/dsp/src/settings.rs
crates/dsp/src/speech.rs

[excluded]

# The one exclusion that carries a real risk, and the reason it is safe: this
# unit reads a settable clock, once, for a header line, so that a human reading
# a saved log can tell which evening it came from. It only ever writes. No unit
# above reads anything from it, and no decision on the audio path depends on
# it.
crates/client-linux/src/delaylog.rs = writes the run's record and reads a settable clock once for a human-readable header; nothing on the path reads it back

# The measurement harness's report writer, and the second exclusion in this
# file that carries a real risk. It reads a settable clock once, for the date in
# a saved report's header, so a human reading the report knows which evening it
# came from. It only ever writes that value into prose. Every figure a report
# carries comes from sample indices and a declared sample rate, or from
# timestamps the series file supplied; nothing computes anything from the date.
# crates/measure/tests/no_settable_wall_clock.rs asserts that this is the ONLY
# unit of that crate which reads one, so the exclusion cannot quietly widen.
crates/measure/src/report.rs = writes the saved report and reads a settable clock once for a human-readable date; no figure it prints is derived from that read

# The deterministic simulator and the pieces that only it uses. They are
# reached from crates/sync/src/lib.rs, which is on the path, and they are not
# on it themselves: no unit above calls into any of them, and a run of the
# shipped client never constructs one. They are here rather than listed because
# listing them would put the simulator's own inputs on the audio path, which
# would be a claim about where they run rather than a check on it.
crates/sync/src/sim.rs = the simulator's run loop; drives modelled clocks in a test, never the playout path, and the shipped binaries never call it
crates/sync/src/jitter.rs = the modelled network delay distributions the simulator draws from; no clock, no device, no wire
crates/sync/src/rng.rs = the seeded generator the jitter models draw from; arithmetic only
crates/sync/src/scenario.rs = parses a committed simulator scenario file; runs before any modelled run and touches no clock
crates/sync/src/crosscheck.rs = renders the committed cross-check vectors the C endpoint is held to; reads scenario files and writes text, never a clock, a device or a wire, and the shipped binaries never call it

# Room-correction fitting (goal 12, docs/room-correction.md): reached from
# crates/dsp/src/lib.rs, which is on the path, and not on it itself. It is an
# analysis the server runs on a recording; no endpoint and no unit above calls
# it, and it reads no clock of any kind.
crates/dsp/src/roomfit.rs = the server's room-correction fitting from a recording; pure arithmetic, no clock, no device, never called on the playout path
crates/sync/src/bin/chorus-sync-vectors.rs = the one-line binary behind `make sync-vectors`; regenerates the committed cross-check vectors and is never part of a run
crates/sync/src/house.rs = the house-scale layer over the simulator; many modelled runs against one modelled server timeline, no clock, no device, no wire
crates/sync/src/house_report.rs = renders the house simulation report as text from a finished modelled run; reads no clock and the shipped binaries never call it
crates/sync/src/bin/chorus-sim-house.rs = runs the committed houses and writes the simulation report; a tool, never part of a run
crates/sync/src/latency_sim.rs = the latency-growth simulator; modelled chunks over modelled links against a modelled server timeline, no clock, no device, no wire, and the shipped binaries never call it
crates/sync/src/latency_report.rs = renders the latency-growth simulation report as text from finished modelled runs; reads no clock and the shipped binaries never call it
crates/sync/src/bin/chorus-sim-latency.rs = runs the committed latency-growth scenarios and writes their report; a tool, never part of a run
crates/sync/src/lowlat_sim.rs = the low-latency TV path simulator (goal 13); modelled datagrams over modelled legs against a modelled server timeline, no clock, no device, no wire, and the shipped binaries never call it
crates/sync/src/bin/chorus-sim-lowlat.rs = runs the committed low-latency scenarios and writes their report; a tool, never part of a run

# The control plane's server side. It changes zone state and hands strings to
# sockets; no unit of it is ever called from the thread that carries audio, and
# the only thing that crosses from it to the audio path is one integer in an
# atomic, which crates/client-linux/src/control.rs is listed above for.
crates/server/src/control.rs = the control channel's sockets, threads and HTTP; it touches no PCM, stamps nothing, and the audio path's calls into it are a session reader applying an endpoint's controller_command (docs/decisions/0067-*) and asking where a session starts and what its greeting says (its room_volume), neither of which reads a clock or writes a chunk, and (goal 14) saying that the session's speaker is up, gone or was refused for a changed key, before the session is given its start and after it ended
crates/server/src/conductor.rs = carries each change to the room model to the sessions (which slot plays what and which a session hears, room_volume, controller_state) and runs the schedule runtime; reads the civil clock once per wake for scheduling only (K30) and the monotonic clock for its durations, touches no PCM, and reaches the audio path only through the router's moves and a bounded slot-command channel the audio thread drains with try_recv, which carries a slot's input and a latency target, never an instant
crates/server/src/events.rs = the event writer: every GET /api/events stream written by one thread on non-blocking sockets; control code, no PCM, never called from the audio thread, and its only clock is the monotonic one for keepalives and the stall bound
crates/server/src/slot_table.rs = plans which group holds which stream slot over a copy of the room model before a change commits; arithmetic and strings, no clock, no PCM
crates/server/src/controller.rs = turns a speaker's controller_command into a control-plane change (docs/decisions/0063-*); arithmetic and strings, no clock, no PCM, reached only from the control plane when a session reader hands it a command
crates/control/src/zones.rs = the server-authoritative zone state; arithmetic and strings, no clock, no PCM, and only the server calls it
crates/control/src/persist.rs = reads and writes the zone state file; runs at start and after a command, never beside the playout loop
crates/control/src/fanout.rs = hands a state message to each control subscriber's bounded queue; no clock, no PCM, and its queues are not the audio ones
crates/control/src/transport.rs = the tier a zone is declared in and the buffer policy a group is held to; read once at start to pick the numbers a run is configured with, in the same class as the configuration parsers below, and never beside the playout loop
crates/control/src/rooms.rs = catalog v2's values (links, channel roles, civil times, windows, sources, definitions) and their spellings; arithmetic and strings, no clock, no PCM, and read by the server's room model, never beside the playout loop
crates/control/src/speakers.rs = goal 14's adopted-speaker records (names, rooms, what a session said of each) and their spellings; strings only, no clock, no PCM, changed by a control command or by a session reader as its session starts and ends, never beside the playout loop
crates/control/src/sound.rs = goal 12's per-room sound values (tone, bass management, room-correction filters) and their spellings; integer arithmetic and strings, no clock, no PCM, read by the server's room model, never beside the playout loop

# HDMI-CEC (goal 13, docs/cec.md): the hub as the TV's Audio System, reached
# from crates/cec/src/lib.rs and crates/client-linux/src/lib.rs. Control, not
# audio: it turns a TV's keys into controller commands and the room's state
# into CEC answers, on its own thread, never the playout loop's. Its only
# clock is the monotonic millisecond count its caller hands in.
crates/cec/src/codec.rs = the CEC message codec; bytes and names, no clock, no PCM
crates/cec/src/validate.rs = whether a received CEC message is well formed; arithmetic on bytes, no clock, no PCM
crates/cec/src/role.rs = the Audio System state machine; handed a monotonic millisecond count by its caller, reads no clock itself, touches no PCM
crates/cec/src/adapter.rs = the CEC adapter trait and its types; no clock, no PCM
crates/cec/src/driver.rs = the role on an adapter, one turn at a time; its clock is the caller's monotonic closure, no PCM, never on the playout thread
crates/cec/src/kernel.rs = the /dev/cecN ioctl binding; the kernel's message timestamps are never read, no PCM
crates/cec/src/fake.rs = the in-memory CEC bus and scripted TV for tests; std's monotonic Instant for receive timeouts only, never part of a shipped run's audio
crates/client-linux/src/cec.rs = the hub's CEC thread: TV keys to controller commands, controller state to CEC answers; monotonic milliseconds from the caller's timeline, no PCM, never on the playout thread

# Discovery. It runs BEFORE any audio exists, to turn "no address" into an
# address, and never again during a session. Same class as the configuration
# parsers below.
crates/discovery/src/lib.rs = resolves where the server is before a byte of audio exists; no PCM, no timestamp on the wire, and never called again once a session has started
crates/discovery/src/bin/chorus-discovery-vectors.rs = the one-line binary behind `make discovery-vectors`; regenerates the committed packet fixtures and is never part of a run

# Grades a saved log after the run, from the file alone. Never runs beside the
# audio path.
crates/client-linux/src/logcheck.rs = grades a saved log after the fact; no PCM, no device, no timestamp on the wire

# Command-line parsing and the bound relations, done once before any audio
# exists. No PCM, no clock, no wire.
crates/client-linux/src/config.rs = parses the configuration at start; touches no PCM, no clock and no wire
crates/server/src/config.rs = parses the configuration at start; touches no PCM, no clock and no wire
crates/server/src/health.rs = the --health-check probe, a separate process mode that starts no server; one TCP request to the control plane, no PCM, no clock read, no timeline
crates/server/src/mqtt.rs = the opt-in MQTT publisher (goal 15, ADR 0116): one ordinary thread that tells a broker the control plane's state; control code, no PCM, no timestamp, never called from the audio thread, and its only clock is the monotonic one for the keep alive, the response timeout and the reconnect wait
crates/mqtt/src/lib.rs = the MQTT publisher's pure half (goal 15, ADR 0116): packet bytes, topic names and pieces of the control state message; no socket, no thread, reads no clock, and nothing on the path calls it

# The host contract. It matters a great deal, and it matters for a different
# property: scheduling and memory, not timestamps. It reads resource limits and
# /proc, never a clock, and never a byte of audio.
crates/server/src/hostreport.rs = the scheduling and memory contract; reads resource limits and /proc, never a clock or a sample
crates/hostctl/src/lib.rs = the scheduling and memory contract; reads resource limits and /proc, never a clock or a sample

# The receive-timestamp check (goal 7, K34), reached from the probe crate's root
# above. The kernel's software receive stamps are CLOCK_REALTIME (socket(7)), so
# comparing a user stamp with one honestly means reading that clock; these units
# do, on purpose, and nothing on the path calls them. The server does not link
# this crate at all.
crates/hostprobe/src/net.rs = reads CLOCK_REALTIME to compare with the kernel's CLOCK_REALTIME receive stamps; a measurement tool the server never links
crates/hostprobe/src/rxstamp.rs = drives the receive-stamp comparison over sockets; reads the settable clock through net.rs, and only in the chorus-rx-stamps tool
crates/hostprobe/src/environment.rs = reads /proc and /sys for a report's header; no clock, no sample, no wire

# The schedule library (goal 11): alarms, sleep timers, quiet hours, ramps and
# chimes. Scheduling speaks civil time (K30), which is why it is not on the
# path and must never be: a quiet-hours window is a wall-clock reading. It
# reads NO clock itself, settable or monotonic (crates/schedule/tests/no_clock.rs
# holds it to that); every instant arrives as an argument from the server, and
# what reaches the audio path from it is a volume in thousandths or PCM it
# rendered ahead of time, never a timestamp.
crates/schedule/src/lib.rs = the schedule library's root; civil time for scheduling only (K30), reads no clock, and nothing on the path calls it
crates/schedule/src/civil.rs = calendar arithmetic on day numbers; no clock, no PCM, no wire
crates/schedule/src/posix.rs = parses a POSIX TZ string and evaluates its rules for an instant it is given; no clock
crates/schedule/src/tzif.rs = parses a TZif zoneinfo file's bytes it is given; no clock, no file read of its own
crates/schedule/src/zone.rs = converts a UTC instant it is given to civil time and back; no clock
crates/schedule/src/window.rs = weekly quiet-hours windows evaluated at an instant it is given; no clock
crates/schedule/src/alarm.rs = alarm schedules and the due-between query over instants it is given; no clock
crates/schedule/src/sleep.rs = sleep-timer plans over monotonic instants it is given; reads no clock itself
crates/schedule/src/ramp.rs = integer volume ramps sampled at an elapsed time it is given; no clock
crates/schedule/src/chime.rs = renders generated chimes to PCM ahead of playback; no clock, no device, no wire, and the samples it returns carry no timestamp

# The server's schedule runtime (goal 11): alarms, sleep timers, quiet hours and
# line-in autoplay over the room model. Reached from crates/server/src/lib.rs,
# which is on the path; it is not on it, for the schedule library's reason: it
# speaks civil time (K30). It reads no clock of either kind (the conductor passes
# both instants in), and what it hands back is a volume in thousandths, a source
# id or a log line, never a timestamp.
crates/server/src/schedule_runtime.rs = civil time for scheduling only; touches no PCM; reads no clock: time is passed in

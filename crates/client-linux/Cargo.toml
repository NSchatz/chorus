[package]
name = "chorus-client-linux"
description = "the minimal Linux client: receive, buffer, play out through ALSA, and log the delay the device reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chorus-protocol = { path = "../protocol" }
chorus-audio = { path = "../audio" }
chorus-alsa = { path = "../alsa" }
chorus-sync = { path = "../sync" }
chorus-control = { path = "../control" }
# The one controller model shared with the firmware (docs/decisions/0067-*).
chorus-controls = { path = "../controls" }
chorus-discovery = { path = "../discovery" }
chorus-opus-sys = { path = "../opus-sys" }
# MPL-2.0, used unmodified from crates.io for FLAC only: docs/decisions/0044-the-vendored-decoders.md
# and deny.toml's exception. Version checked on crates.io 2026-09-30.
symphonia-core = { version = "=0.6.1", default-features = false }
symphonia-bundle-flac = { version = "=0.6.1", default-features = false }

[[bin]]
name = "chorus-client"
path = "src/main.rs"

[[bin]]
name = "chorus-delaylog-check"
path = "src/bin/delaylog_check.rs"

[lints]
workspace = true

[package]
name = "chorus-server"
description = "the chorus server: PCM ingest, chunking on one monotonic timeline, and the host contract it runs under"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chorus-protocol = { path = "../protocol" }
chorus-audio = { path = "../audio" }
chorus-hostctl = { path = "../hostctl" }
chorus-control = { path = "../control" }
chorus-discovery = { path = "../discovery" }
# The rig's chirp, for `--source chirp`: the waveform and the amplitude ceiling
# come from the one place that defines them, so what the endpoints play is what
# the lag analyser looks for. A pure library with no third-party dependency; its
# device half binds ALSA at run time, so nothing is added to this build.
chorus-measure = { path = "../measure" }

[dev-dependencies]
# The end-to-end tests decode what the server put on a real socket with the
# same receiver the client uses, so a framing decision is tested once rather
# than modelled twice.
chorus-client-linux = { path = "../client-linux" }

[[bin]]
name = "chorus-server"
path = "src/main.rs"

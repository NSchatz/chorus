[package]
name = "chorus-server"
description = "the chorus server: PCM ingest, chunking on one monotonic timeline, and the host contract it runs under"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chorus-protocol = { path = "../protocol" }
chorus-audio = { path = "../audio" }
chorus-hostctl = { path = "../hostctl" }
chorus-control = { path = "../control" }
chorus-discovery = { path = "../discovery" }
# The schedule runtime (src/schedule_runtime.rs) fires alarms, counts sleep
# timers down and follows quiet hours with the schedule library: civil time
# from TZif, the due query, ramps and the chime names. A pure crate with no
# dependency of its own.
chorus-schedule = { path = "../schedule" }
# A line-in's latency grows without a glitch when rooms join its group (K94,
# ADR 0071): the latency plan and the cubic resampler, run on the audio thread
# by src/slots.rs. A pure library with no third-party dependency.
chorus-sync = { path = "../sync" }
# The rig's chirp, for `--source chirp`: the waveform and the amplitude ceiling
# come from the one place that defines them, so what the endpoints play is what
# the lag analyser looks for. A pure library with no third-party dependency; its
# device half binds ALSA at run time, so nothing is added to this build.
chorus-measure = { path = "../measure" }

[dev-dependencies]
# The end-to-end tests decode what the server put on a real socket with the
# same receiver the client uses, so a framing decision is tested once rather
# than modelled twice.
chorus-client-linux = { path = "../client-linux" }
# tests/schedule_runtime.rs holds the schedule runtime to reading no clock with
# the audio-path check's own settable-clock vocabulary, as the schedule crate's
# no-clock test does, rather than a second word list that could drift.
chorus-audio-path = { path = "../audio-path" }

[[bin]]
name = "chorus-server"
path = "src/main.rs"

[lints]
workspace = true

[package]
name = "chorus-protocol"
description = "chorus wire protocol: framing, message catalog, encoder and decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The v2 session's crypto primitives (BRIEF.md 3.2: crypto primitives are platform, vendored).
# Exact pins; versions, licences and the one-version-each check:
# docs/decisions/0039-the-v2-key-exchange.md.
[dependencies]
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }

[lints]
workspace = true

# A Wi-Fi-like link (audit A-1, WIFI-7's tier): a two-state burst model. In
# the quiet state delay is exponential with a 400 us mean; a packet enters a
# burst with probability 0.03 and leaves one with probability 0.2, so bursts
# average five packets (two and a half exchanges) and about one packet in
# eight is in one; in a burst the delay is Lomax (Pareto type II) with a 3 ms
# scale and a tail index of 1.5, capped at 50 ms. The return path is 300 us
# slower than the forward one (uplink contention). Every one of those numbers
# is ASSUMED: nothing in this repository has measured a Wi-Fi link yet, and
# WIFI-7's characterization on hardware is what replaces them. The bound is
# the wireless tier's 5 ms (docs/decisions/0024-the-wireless-tier.md,
# wireless_bound_us), not the wired 1 ms.

name = wifi-burst

seed = 2718281828
duration_ms = 120000
step_ms = 10
sync_interval_ms = 1000

server_ppm = -3.0
client_ppm = 31.0
initial_offset_ns = -40000000

base_one_way_delay_us = 1500.0
path_asymmetry_us = 300.0
jitter_model = burst
jitter_scale_us = 400.0
burst_enter_prob = 0.03
burst_exit_prob = 0.2
burst_scale_us = 3000.0
burst_shape = 1.5

settle_deadline_ms = 20000
error_bound_ns = 5000000

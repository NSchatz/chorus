# The same segment carrying other traffic: exponentially distributed queuing
# with a 150 us mean, so most exchanges sail through and some are held up
# badly. Both crystals are off, in opposite directions, for a 50.5 ppm
# relative skew. Twice the run length of the quiet case, because the thing
# worth catching here is a filter that copes for a minute and then does not.

name = wired-loaded

seed = 2882400001
duration_ms = 120000
step_ms = 10
sync_interval_ms = 1000

server_ppm = -12.5
client_ppm = 38.0
initial_offset_ns = -8000000

base_one_way_delay_us = 200.0
jitter_model = exponential
jitter_scale_us = 150.0

settle_deadline_ms = 10000
error_bound_ns = 1000000

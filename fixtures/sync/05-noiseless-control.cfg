# The degenerate case: identical clocks, no jitter, no initial offset. Nothing
# needs correcting and the modelled error should be exactly zero for the whole
# run, not merely small. It is committed because a model that cannot be exact
# where exactness is available is a model with a leak in it, and this is the
# cheapest place to notice.

name = noiseless-control

seed = 1
duration_ms = 30000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 0.0
client_ppm = 0.0
initial_offset_ns = 0

base_one_way_delay_us = 100.0
jitter_model = none
jitter_scale_us = 0.0

settle_deadline_ms = 1000
error_bound_ns = 1000000

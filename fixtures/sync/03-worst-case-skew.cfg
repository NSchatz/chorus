# The worst realistic crystal pair: BRIEF.md section 6 puts devices at +/- 20
# to 50 ppm each, so 50 fast against 50 slow is 100 ppm relative, which is
# 6 ms of divergence per minute with nothing correcting it. A slower link with
# more jitter, and 25 ms of initial epoch offset to acquire.

name = worst-case-skew

seed = 3735928559
duration_ms = 90000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 50.0
client_ppm = -50.0
initial_offset_ns = 25000000

base_one_way_delay_us = 250.0
jitter_model = uniform
jitter_scale_us = 200.0

settle_deadline_ms = 10000
error_bound_ns = 1000000

# A crystal that wanders (audit A-1): the client's rate takes a random walk
# with a standard deviation of 0.1 ppm per square root of a second on top of
# its 35 ppm, so over the two minute run it moves by about 1 ppm, and over an
# hour it would move by about 6. That is several times what a room at a steady
# temperature does to an uncompensated crystal (ASSUMED; no crystal here has
# been measured), chosen so a servo that learned the rate once and stopped
# tracking it would show. The wander has its own random stream, so the
# network below is the quiet wired segment's.

name = crystal-wander

seed = 1414213562
duration_ms = 120000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 0.0
client_ppm = 35.0
initial_offset_ns = 9000000
client_wander_ppm_per_sqrt_s = 0.1

base_one_way_delay_us = 120.0
jitter_model = uniform
jitter_scale_us = 60.0

settle_deadline_ms = 10000
error_bound_ns = 1000000

# A quiet wired segment: one clock nominally perfect, the other 40 ppm fast,
# a switch that adds at most 60 us of queuing. This is the case the whole
# system is designed around, so it is the first scenario.
#
# The run starts 12.345 ms out because two monotonic clocks have no shared
# epoch. Acquiring the timeline is the servo's first job.

name = wired-quiet

seed = 1591709697
duration_ms = 60000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 0.0
client_ppm = 40.0
initial_offset_ns = 12345000

base_one_way_delay_us = 120.0
jitter_model = uniform
jitter_scale_us = 60.0

settle_deadline_ms = 10000
error_bound_ns = 1000000

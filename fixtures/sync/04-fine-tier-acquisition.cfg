# An initial offset of 2.5 ms, deliberately inside the 3 ms hard resync
# threshold, so the fine tier has to pull it in on its own. It cannot do that
# quickly: the correction is clamped at 500 ppm, which is 500 us of catching
# up per second, so this scenario is the one that exercises the clamp and the
# anti-windup rule that goes with it. Everything else here is unremarkable on
# purpose, so a failure points at the correction law and nothing else.

name = fine-tier-acquisition

seed = 43981
duration_ms = 60000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 0.0
client_ppm = 45.0
initial_offset_ns = 2500000

base_one_way_delay_us = 150.0
jitter_model = uniform
jitter_scale_us = 100.0

settle_deadline_ms = 20000
error_bound_ns = 1000000

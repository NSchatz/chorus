# An asymmetric path (audit A-1): the return direction's base delay is 400 us
# longer than the forward one, the way a link whose upstream queue is busier
# than its downstream one behaves. The NTP offset estimate is exact only for
# a symmetric path (RFC 5905 section 8), and the bias it takes on here is half
# the asymmetry, 200 us, in the minimum round trip as much as in any other:
# no filter can see it. So this scenario is committed to show the loop holds
# the bound WITH a standing 200 us error it cannot remove, not that the error
# goes away. 400 us is ASSUMED, several times the queuing the wired
# scenarios model, so the bias is unmistakable in the vector.

name = asymmetric-path

seed = 3141592653
duration_ms = 90000
step_ms = 10
sync_interval_ms = 1000

server_ppm = 5.0
client_ppm = -22.0
initial_offset_ns = 17000000

base_one_way_delay_us = 180.0
path_asymmetry_us = 400.0
jitter_model = uniform
jitter_scale_us = 80.0

settle_deadline_ms = 10000
error_bound_ns = 1000000

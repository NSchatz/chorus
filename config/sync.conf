# The constants SYNC-4 fixed, committed so that a check and the thing it checks
# cannot drift apart.
#
# What each of these was chosen FROM is in
# docs/decisions/0014-the-sync-loop-on-the-real-path.md. None of them is copied
# from BRIEF.md: the roadmap phase says filter windows, thresholds and the
# correction clamp are OUTPUTS of this phase and the brief's numbers are
# another project's starting points. Where a value here happens to equal one of
# those, the decision record says so and says why.
#
# crates/client-linux/tests/sync_loop.rs asserts every line below equals the
# compiled constant of the same name in crates/client-linux/src/sync.rs, and
# tools/sync-hour-run.sh passes them to the client on its command line, so the
# run that is graded is the run these numbers describe.
#
# Format: key = value, '#' starts a comment.

# Exchanges in the minimum-round-trip window.
filter_window = 64

# Weight of a new sample in the exponential smoother.
smoothing_alpha = 0.0625

# Error at or above which the loop steps rather than slews, in microseconds.
hard_resync_threshold_us = 2000

# Largest rate correction the loop will apply, in ppm.
max_correction_ppm = 300

# How old the newest accepted sample may be before the offset is stale, in
# milliseconds.
staleness_limit_ms = 10000

# Largest round trip an exchange may report and still be admitted, in
# microseconds.
max_rtt_us = 100000

# How often the client runs an exchange and updates the servo, in milliseconds.
sync_interval_ms = 500

# The fixed end-to-end playout latency every endpoint in a group applies, in
# microseconds. Content due at t is audible at t + this, at every endpoint.
playout_latency_us = 180000

# How much audio is silenced around a hard resync's splice, in microseconds.
mute_us = 20000

# How long the hour-long rig run runs, in seconds. Longer than an hour on
# purpose: the measurement starts after the loop has acquired the timeline, and
# AC-1 asks for at least one hour of it. 3900 is the settle below plus a graded
# hour plus four minutes of slack for the analysis between captures.
sync_hour_run_seconds = 3900

# How much of the run passes before the FIRST capture, in seconds. AC-1 asks
# for an hour with no hard resync after the first minute, so the first minute is
# the acquisition transient and is deliberately outside every capture: a rig
# that captured it would be measuring the thing the criterion excludes.
sync_hour_settle_seconds = 60

# How many captures the rig takes across the graded hour. Inter-device error is
# a distribution over the hour and one window at one instant is not it, so the
# captures are spread evenly from the end of the settle to the end of the run.
sync_hour_captures = 6

# How long each of those captures runs, in seconds.
sync_hour_capture_seconds = 30

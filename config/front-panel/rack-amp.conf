# chorus front panel: the rack amp (K70, K74), an ASSUMED example.
#
# The rack amp's board and pins are unanswered owner inputs (the Needs items on the Linux board
# and the rack; goal 26 designs the amp), so every path, pin and code here is ASSUMED. Read by
# chorus-client --front-panel <this file>; docs/hardware/controls.md "The Linux front panel" and
# docs/decisions/0067-*. crates/client-linux/src/front_panel.rs parses this file in a test.
#
# The overlay lines that would produce this panel on a Raspberry Pi 5 (config.txt; parameters
# per the overlays README, https://github.com/raspberrypi/firmware/blob/master/boot/overlays/README,
# read 2026-09-30; GPIO numbers ASSUMED):
#   dtoverlay=gpio-key,gpio=5,active_low=1,gpio_pull=up,label=play-pause,keycode=164
#   dtoverlay=gpio-key,gpio=6,active_low=1,gpio_pull=up,label=volume-up,keycode=115
#   dtoverlay=gpio-key,gpio=13,active_low=1,gpio_pull=up,label=volume-down,keycode=114
#   dtoverlay=gpio-key,gpio=19,active_low=1,gpio_pull=up,label=next,keycode=163
#   dtoverlay=gpio-key,gpio=26,active_low=1,gpio_pull=up,label=previous,keycode=165
#   dtoverlay=gpio-key,gpio=16,active_low=1,gpio_pull=up,label=pairing,keycode=218
#   dtoverlay=gpio-led,gpio=20,label=chorus-status
# Key codes as the evdev crate 0.13.2 lists them (Apache-2.0 OR MIT,
# https://docs.rs/evdev/0.13.2/src/evdev/scancodes.rs.html, read 2026-09-30): KEY_PLAYPAUSE 164,
# KEY_VOLUMEUP 115, KEY_VOLUMEDOWN 114, KEY_NEXTSONG 163, KEY_PREVIOUSSONG 165, KEY_CONNECT 218.

# The rack amp is the streaming-amp class in a 2U case: its controls are K70's.
class streaming-amp
# The zone its buttons control; without this line, the client's --zone.
room rack
# A long press of play/pause while the room plays alone joins this group (ASSUMED name).
join-target downstairs
# The input device the gpio-keys overlay creates (ASSUMED path; /dev/input/by-path names are
# stable across boots where eventN numbers are not). Whether each gpio-key overlay call makes its
# own device is ASSUMED unknown here: if it does, give one `input` line per device.
input /dev/input/by-path/platform-gpio-keys-event
key 164 play-pause
key 115 volume-up
key 114 volume-down
key 163 next
key 165 previous
key 218 pairing
# The status light in the LED class (gpio-led's label; a single-colour LED shows brightness only).
led /sys/class/leds/chorus-status

# Values the verifications share, committed so that a check and the thing it
# checks cannot drift apart.
#
# Format: key = value, '#' starts a comment.

# The deliberate rate difference the overflow verification applies. The client
# refuses a configuration whose span, divided by this, is not crossed inside a
# ten-minute run: 240000 us of span at 2000 ppm crosses in 120 s.
ac9_rate_skew_ppm = 2000

# The stream the ten-minute run plays.
sample_rate_hz = 48000
channels = 2
sample_format = pcm_s16le
chunk_us = 20000

# The client's bounds, start fill and the delay it holds. Every one of these is
# recorded in the delay log at start, so a run can be graded without them.
min_us = 60000
max_us = 300000
start_fill_us = 120000
device_target_us = 120000

# How long the ten-minute run runs. Longer than ten minutes on purpose: the
# graded interval opens after the start fill and has to be at least 600 s.
ten_minute_run_seconds = 640

# The CPU-time bound every real-time thread is given, and the priority asked
# for. Both are clamped by what the host granted.
rttime_us = 200000
rt_priority = 20

# How much locked memory the server asks for.
memlock_wanted_bytes = 67108864

# How many consecutive repetitions the control-plane thread-population checks
# are run for before they may be called deterministic. Those checks take workers
# from a FIXED pool to grade it, so whether one run of them passes is partly a
# scheduling decision, and one green run is not the claim. tools/control-
# determinism.sh runs this many on one build and refuses fewer than fifty,
# whether the fewer comes from here or from CHORUS_DETERMINISM_REPETITIONS.
#
# A hundred rather than the floor of fifty, because a repetition costs about a
# second on the two CPUs that check gives them and the interleaving it is
# looking for turned up about once in fourteen: fifty leaves a few runs in a
# hundred where a reintroduced race would go unseen, and a hundred leaves one in
# a thousand.
control_determinism_repetitions = 100

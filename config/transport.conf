# The transport tier a zone is declared in, and what each tier is held to.
#
# Committed here for the same reason config/sync.conf exists: a check and the
# thing it checks cannot drift apart if there is one copy of the number. What
# each value was chosen FROM is in docs/decisions/0021-the-wireless-tier.md,
# and no value here is copied from BRIEF.md without that record saying so and
# saying why.
#
# Nothing in this file is a servo constant. The constants SYNC-4 fixed are in
# config/sync.conf and this phase moves none of them: the answer to Wi-Fi
# jitter is a bigger buffer or a wired zone, never servo aggression
# (BRIEF.md section 9).
#
# Nothing in this file is a MEASURED number either. Every figure below is a
# declared policy, and the two criteria that would measure a wireless zone are
# operator graded and NOT passed here; docs/wireless-expectations.md and
# docs/verification-record.md both say so in as many words.
#
# Format: key = value, '#' starts a comment. Read from Rust by
# crates/control/src/transport.rs and from the shell by tools/lib.sh.

# --- the tiers ----------------------------------------------------------------

# Every transport a zone may be declared with, in the order they are reported.
# A zone declared as anything else is refused at start, by name, with this list
# quoted back.
transports = wired wireless

# What a zone that declares no transport is. Wired, because the house is wired
# first and a zone nobody declared must not inherit the looser tier by silence.
default_transport = wired

# --- the bound each tier is held to -------------------------------------------
#
# Inter-device error, in microseconds. These are the acceptable columns of
# BRIEF.md section 2.2 and they are adopted rather than derived; the decision
# record says which row each came from.

# Same room, and the bound SYNC-4 was written against. Unchanged by this phase.
wired_bound_us = 500

# Different rooms over Wi-Fi. This is the phase's own assertion: a wireless
# zone is held to the multiroom bound and is NOT held to the wired one.
wireless_bound_us = 5000

# --- the wireless buffer policy -----------------------------------------------
#
# Buffer DEPTH and playout LATENCY, which is what "bigger buffers" means
# operationally. Deliberately not expressed as a memory placement: the endpoint
# tree prohibits external-RAM placement outright (firmware/endpoint-units.conf
# rule 3 and the EXTERNAL_RAM_NAMES list in firmware/check/endpoint_scan.c), so
# where those bytes live is not this file's business and a PSRAM buffer would
# arrive as a deliberate change to that rule rather than as a quiet attribute.
#
# The wired equivalents are NOT copied here. They live in
# config/verification.conf (min_us, max_us, start_fill_us, device_target_us) and
# config/sync.conf (playout_latency_us), and one copy of a number is the whole
# point of these files.

# The band a wireless run's buffer occupancy is graded against.
wireless_min_us = 120000
wireless_max_us = 900000

# Buffered audio accumulated before the first frame is written.
wireless_start_fill_us = 400000

# The device-reported delay a wireless endpoint's playout loop holds.
wireless_device_target_us = 300000

# The fixed end-to-end playout latency every endpoint in a group held to this
# policy applies. Content due at t is audible at t + this, at every endpoint in
# the group. It is the one number here a reader is most likely to want a source
# for, and it has one: BRIEF.md section 5.2's recommended default buffer for
# music. It is a POLICY and not a measurement.
wireless_playout_latency_us = 500000

# The measurement rig's declared values, committed so that a run and the
# thresholds it was graded against cannot drift apart.
#
# Format: key = value, '#' starts a comment. Read from Rust by
# crates/measure/src/config.rs and from the shell by the `conf`-style helper in
# tools/lib.sh.
#
# Nothing in this file is a target. The rig holds no view about whether a
# measured number is good; every value below is either a limit on what the rig
# is allowed to DO, or a floor under what it is allowed to CLAIM.

# --- the one limit that protects hardware ------------------------------------
#
# The highest chirp amplitude, in full-scale units, any run may request. The
# chirp leaves through a real amplifier into a real loudspeaker; an over-level
# chirp damages a driver rather than failing a test, which is the only
# irreversible thing anything in this rig can do. A run that asks for more than
# this refuses to start and emits no audio.
chirp_amplitude_ceiling = 0.25

# --- the capture the analysis expects ----------------------------------------
#
# 96 kHz because one sample is then 10.4 us, and BRIEF.md section 10 asks for
# 10 us or better; the peak is resolved more finely than one sample, which is
# what makes that reachable rather than an aspiration.
capture_sample_rate_hz = 96000

# The sweep. 1 kHz to 8 kHz is broad enough for a narrow correlation peak and
# stays inside the band a small loudspeaker reproduces honestly.
chirp_start_hz = 1000
chirp_end_hz = 8000
chirp_period_us = 20000

# --- the analysis ------------------------------------------------------------
#
# One window per sweep, stepped an eighth of a sweep at a time, so a 100 ms
# capture yields tens of independent lag estimates rather than one.
window_us = 20000
hop_us = 2500

# The widest lag the correlation searches, either way. A peak that lands on the
# edge of this range is refused rather than reported: the true peak may be
# outside it, and a number taken from the edge of a search window is a guess.
max_lag_us = 1000

# The normalised correlation coefficient a window's peak has to reach before
# its lag is used at all. Two independent noise sources over one window reach
# about 0.08 here, so this is far above chance and far below what a real shared
# chirp produces.
confidence_floor = 0.6

# A channel quieter than this is silent, and a capture with a silent channel is
# refused rather than correlated against nothing.
silence_floor_dbfs = -80

# The fraction of a channel's energy that has to lie inside the chirp's band
# before the rig accepts that a chirp is present at all. Full-band noise scores
# about 0.15 here and a real sweep about 0.99.
chirp_band_fraction_floor = 0.5

# The fewest windows that have to resolve before a run reports any figure. A
# median of one window is not a distribution.
min_resolved_windows = 4

# --- the free-run drift fit --------------------------------------------------
#
# The fewest observations, and the shortest span, that can be fitted at all.
# The confidence half-width below uses a normal approximation, which is what
# the 30-observation floor is for.
free_run_min_points = 30
free_run_min_span_s = 60

# The widest 95% confidence half-width, in ppm, a published slope may carry.
# BRIEF.md section 6 expects 20 to 50 ppm per device, so a slope this rig
# cannot bound to within 1 ppm cannot distinguish one device from another and
# is not published.
free_run_max_half_width_ppm = 1.0

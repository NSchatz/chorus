            name: Treble
            icon: mdi:music-clef-treble
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: switch.kitchen_kitchen_loudness
            name: Loudness
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.kitchen_kitchen_night_mode
            name: Night mode
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.kitchen_kitchen_speech_enhancement
            name: Speech enhancement
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.kitchen_kitchen_quiet_hours

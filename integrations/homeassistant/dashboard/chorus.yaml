              - type: numeric-input
                style: buttons
          - type: tile
            entity: switch.study_study_loudness
            name: Loudness
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.study_study_night_mode
            name: Night mode
            features_position: inline
            features:

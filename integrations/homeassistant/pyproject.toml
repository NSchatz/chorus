[project]
name = "chorus-homeassistant"
version = "0.18.0"
description = "The chorus Home Assistant custom integration and its vendored client"
requires-python = "==3.14.8"
license = "MIT OR Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.366",
    "mypy==2.3.1",
    "ruff==0.16.3",
# What the `assist_satellite` platform's Home Assistant components import
# (assist_satellite, assist_pipeline, conversation, tts, ffmpeg), at the
# versions core 2026.9.3 pins in their manifests. Test-only: on a running
# Home Assistant they are core's own requirements, so the integration's
# manifest still lists none.
    "hassil==3.12.1",
    "home-assistant-intents==2026.8.28",
    "gazetteer-matcher==1.1.0",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "mutagen==1.48.1",
    "ha-ffmpeg==3.2.2",
]
# What Home Assistant's own hassfest imports beyond the harness, at the versions
# core 2026.9.3 pins in requirements_all.txt (`make ha-hassfest`).
hassfest = [
    "infrared-protocols==9.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-p", "no:cacheprovider", "-ra"]

[tool.coverage.run]
source = ["custom_components.chorus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/chorus"]
cache_dir = "/dev/null"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]

# Home Assistant's own mypy.ini lets its components re-export what they import
# (media_player's entity, features and browse types are imported from it).
[[tool.mypy.overrides]]
module = "homeassistant.components.*"
implicit_reexport = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FURB", "G", "I", "ICN", "LOG",
    "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM",
    "SLF", "T20", "TRY", "UP", "W",
]
ignore = [
    "D203",    # one blank line before a class docstring: D211 is the one kept
    "D213",    # a docstring's summary on the second line: D212 is the one kept
    "PLR0911", # many returns: the state mapping reads better flat
    "PLR2004", # magic values: HTTP status codes are named by their numbers
    "TRY003",  # long messages in exceptions: the message is for a person
    "E501",    # the formatter holds the line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF001", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PT012", "N818", "ASYNC110", "C901"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

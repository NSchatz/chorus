---
name: release

# Cuts a chorus release (docs/release.md, ADR 0235). A pushed tag `v<x.y.z>`
# on a commit of main runs `make release VERSION=<x.y.z>` with the pinned
# toolchains, as nightly.yml provisions them, and creates the GitHub release
# from dist/v<x.y.z>/: NOTES.md is its body and every other file it holds
# is attached. tools/release.sh refuses a commit not on main, a version that
# differs from Cargo.toml, a dirty tree or an ESP-IDF that is not the pinned
# one, and holds the directory to `tools/release.sh --list`.
#
# By hand, `dry-run` (the default) builds the release of a commit on main,
# with Cargo.toml's version (a tag's own, run on a tag), and uploads dist/
# as a workflow artifact, publishing nothing. `dry-run: false` on a v<x.y.z>
# tag publishes, which retries a tag whose run failed. The build runs with a
# read-only token; only the publish job, which runs no build script, can
# write.
#
# `sources-for: v<x.y.z>`, by hand on main, builds only the Debian source
# packages of that release's Soloist image (tools/soloist-sources.sh, ADR
# 0241) and, with `dry-run: false`, attaches them to that existing release:
# for a release cut before its tarball was one of the artifacts (v0.2.0,
# docs/release.md). The release's binary pins must be main's, so main's
# source pins are that image's sources.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and upload dist/ only; publish nothing
        type: boolean
        default: true
      sources-for:
        description: >-
          A release tag v<x.y.z>: build (and, without dry-run, attach) only
          its Soloist image's Debian source packages
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: make release
    if: github.event_name == 'push' || inputs.sources-for == ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history: release.sh checks the commit against main and takes
      # the artifacts' timestamps from it. No credential is left in
      # .git/config while the builds run third-party build scripts.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag names the version; by hand it is Cargo.toml's. Publishing by
      # hand needs a release tag to publish under.
      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            ver="${REF_NAME#v}"
          else
            ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          if ! printf '%s' "$ver" | grep -q -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$ver' is not a release version x.y.z"
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$REF_TYPE" != tag ]; then
            echo "::error::only a v<x.y.z> tag is published; run on the" \
              "tag, or as a dry run"
            exit 1
          fi
          echo "release v$ver from $(git rev-parse HEAD)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # The pinned tools from mise.toml, checked against mise.lock's digests
      # (zig and cargo-zigbuild among them), as in nightly.yml.
      - name: Pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.7.5

      # release.sh refuses a dirty tree; say here if setup made it one.
      - name: Tree still clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      # rust-toolchain.toml names the exact toolchain; rustup installs it on
      # first use, with the musl target the server binary is built for.
      - name: Toolchain
        run: rustup show active-toolchain

      # The version and commit are firmware/config/endpoint.conf's pin;
      # tools/firmware-image.sh refuses any other. As in nightly.yml.
      - name: ESP-IDF
        run: |
          git clone --branch v6.1 --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          git -C "$HOME/esp-idf" rev-parse HEAD
          "$HOME/esp-idf/install.sh" esp32s3
          # cmake and ninja are installed on request in v6.1 (ADR 0042).
          (cd "$HOME/esp-idf" && python3 tools/idf_tools.py install cmake ninja)
          printf '. %s/export.sh\n' "$HOME/esp-idf" > "$HOME/idf-env.sh"
          echo "CHORUS_IDF_ENV=$HOME/idf-env.sh" >> "$GITHUB_ENV"

      - name: make release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_BUILD_JOBS: "2"
          IDF_PY_BUILD_JOBS: "2"
        run: |
          make release VERSION="$VERSION"
          {
            echo "### chorus v$VERSION from \`$(git rev-parse HEAD)\`"
            echo '```'
            cat "dist/v$VERSION/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The release as built: what the publish job attaches, and what a
      # dry run is checked against (`tools/release.sh --list`).
      - name: Upload dist
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chorus-v${{ steps.version.outputs.version }}
          path: dist/v${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: create the GitHub release
    needs: build
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download dist
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chorus-v${{ needs.build.outputs.version }}
          path: dist

      # --verify-tag: the tag exists already, pushed by whoever cut the
      # release; nothing here creates or moves one. NOTES.md is the body,
      # everything else is attached.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name NOTES.md -printf '%f\n' |
            LC_ALL=C sort > "$RUNNER_TEMP/assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "chorus v$VERSION" \
            --notes-file NOTES.md "${assets[@]}"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' |
            LC_ALL=C sort > "$RUNNER_TEMP/published.txt"
          diff "$RUNNER_TEMP/assets.txt" "$RUNNER_TEMP/published.txt"
          n="$(wc -l < "$RUNNER_TEMP/published.txt")"
          echo "published v$VERSION: $n assets" >> "$GITHUB_STEP_SUMMARY"

  sources:
    name: the Debian sources of a released Soloist image
    if: github.event_name == 'workflow_dispatch' && inputs.sources-for != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # From main only, for a release tag whose Soloist image was built from
      # the binary pins main has now: then main's source pins, which
      # check-pins.sh ties to them, are that image's sources.
      - name: Same pins as the release
        env:
          TAG: ${{ inputs.sources-for }}
          REF: ${{ github.ref }}
        run: |
          if ! printf '%s' "$TAG" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag v<x.y.z>"
            exit 1
          fi
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::run sources-for on main, not $REF"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          pins=deploy/soloist/debian-packages.pins
          if ! git diff --quiet "$TAG" HEAD -- "$pins"; then
            echo "::error::deploy/soloist/debian-packages.pins at $TAG is not" \
              "main's; its sources are not the ones main pins"
            exit 1
          fi
          bash tools/conventions/check-pins.sh

      - name: make soloist-sources
        env:
          TAG: ${{ inputs.sources-for }}
          CHORUS_SOLOIST_IMAGE_CACHE: ${{ runner.temp }}/soloist-cache
        run: |
          out="dist/chorus-soloist-$TAG-debian-sources.tar"
          CHORUS_SOLOIST_SOURCES_OUT="$out" make soloist-sources
          {
            echo "### Debian sources of the chorus $TAG Soloist image"
            echo '```'
            sha256sum "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chorus-soloist-${{ inputs.sources-for }}-debian-sources
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach-sources:
    name: attach them to the release
    needs: sources
    if: '!inputs.dry-run'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the tarball
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chorus-soloist-${{ inputs.sources-for }}-debian-sources
          path: dist

      # The release must carry the Soloist image these are the sources of,
      # and not these already: nothing here replaces an asset.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.sources-for }}
        run: |
          name="chorus-soloist-$TAG-debian-sources.tar"
          assets="$RUNNER_TEMP/assets.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$assets"
          if ! grep -q -x "chorus-soloist-$TAG-oci.tar" "$assets"; then
            echo "::error::release $TAG carries no Soloist image"
            exit 1
          fi
          if grep -q -x "$name" "$assets"; then
            echo "::error::release $TAG already carries $name"
            exit 1
          fi
          gh release upload "$TAG" "dist/$name" --repo "$GITHUB_REPOSITORY"
          size="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq ".assets[] | select(.name == \"$name\") | .size")"
          if [ "$size" != "$(stat -c %s "dist/$name")" ]; then
            echo "::error::$name on release $TAG is $size bytes, not" \
              "$(stat -c %s "dist/$name")"
            exit 1
          fi
          echo "attached $name to $TAG: $size bytes" >> "$GITHUB_STEP_SUMMARY"

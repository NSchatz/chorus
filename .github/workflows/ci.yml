name: ci

# The gate is `make gate` (tools/gate.sh): this job installs what the gate needs
# on a fresh runner and calls it, nothing more, so CI and a local run cannot
# drift apart. It is an informational signal: GitHub Actions jobs do not start on
# this private repository, and the merge rule is the local gate run pasted in
# the pull request (docs/decisions/0002-repository-layout-and-ci.md, R12).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make gate
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      IDF_PY_BUILD_JOBS: "2"
      CHORUS_CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The gate's pinned tools from mise.toml, checked against mise.lock's
      # digests (gitleaks, cargo-deny, the linters). mise-action v5.0.0,
      # https://github.com/jdx/mise-action/releases/tag/v5.0.0 (read
      # 2026-09-30); mise itself pinned to the release this repository uses.
      - name: Pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.7.5

      # rust-toolchain.toml names the exact toolchain; rustup installs it on
      # first use.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          sudo apt-get update && sudo apt-get install -y ccache

      # The version and commit are firmware/config/endpoint.conf's pin; the gate
      # refuses any other.
      - name: ESP-IDF
        run: |
          git clone --branch v5.3.6 --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          git -C "$HOME/esp-idf" rev-parse HEAD
          "$HOME/esp-idf/install.sh" esp32s3
          printf '. %s/export.sh\n' "$HOME/esp-idf" > "$HOME/idf-env.sh"
          echo "CHORUS_IDF_ENV=$HOME/idf-env.sh" >> "$GITHUB_ENV"

      # The identity step needs the private term list, which never exists on
      # a runner: with CI=true (set by GitHub) it prints SKIPPED and the
      # reason; everywhere else its absence fails the gate.
      - name: make gate
        run: make gate

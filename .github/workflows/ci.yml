---
name: ci

# The changed-only gate (`make gate-changed`, tools/gate.sh changed; decided by
# the owner 2026-10-06), on every pull request, on every push to main and by
# hand: the conventions checks, then fmt, clippy and the tests of only the
# crates the change touches and the crates that depend on them
# (tools/changed.sh, from `cargo metadata`), and the Home Assistant, web and
# firmware host checks only when their trees changed. A docs-only change builds
# and tests nothing. Two minutes is the target; a slower run warns and does not
# fail. The full gate (`make gate`) runs nightly on main from
# .github/workflows/nightly.yml.
#
# A pull request merges when its gate passes and one fresh-context reviewer has
# read the diff; a red night gets a fix-forward task. A push to a pull request's
# branch cancels the run in progress for that branch; a push to main is never
# cancelled.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'push' && github.sha
    || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    name: make gate-changed
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      # Full history: the conventions checks read it, and the change is the
      # diff from the base.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # The base the change is measured from: a pull request's base commit, a
      # push's previous main, or (by hand) origin/main.
      - name: What changed
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] ||
            ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "CHORUS_GATE_BASE=$base" >> "$GITHUB_ENV"
          git diff --name-only "$base"...HEAD | sed 's/^/changed: /'
          tree='^(firmware/|fixtures/|third_party/|config/|[^/]*\.conf$)'
          if git diff --name-only "$base"...HEAD | grep -q -E "$tree"; then
            echo "firmware-tree=1" >> "$GITHUB_OUTPUT"
          fi

      # The gate's pinned tools from mise.toml, checked against mise.lock's
      # digests (mise-action v5.0.0,
      # https://github.com/jdx/mise-action/releases/tag/v5.0.0, read
      # 2026-09-30).
      - name: Pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.7.5

      # rust-toolchain.toml names the exact toolchain; rustup installs it on
      # first use.
      - name: Toolchain
        run: rustup show active-toolchain

      # The nightly full gate saves this cache from main; a pull request only
      # restores it. Swatinem/rust-cache v2.9.2,
      # https://github.com/Swatinem/rust-cache/releases/tag/v2.9.2 (read
      # 2026-10-06).
      - name: Rust build cache
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          shared-key: chorus-gate
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only when the change can reach the firmware: its host build compiles
      # the crypto library (TF-PSA-Crypto) from the ESP-IDF v6.1 tree, pinned
      # by commit in firmware/Makefile, which refuses any other. The source
      # tree alone; no toolchain is installed.
      - name: ESP-IDF v6.1 crypto sources
        if: steps.plan.outputs.firmware-tree == '1'
        run: |
          git clone --branch v6.1 --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          echo "CHORUS_IDF_V61_DIR=$HOME/esp-idf" >> "$GITHUB_ENV"

      # The identity step's private term list, as in nightly.yml: written to
      # the runner's temp directory, every term masked; a fork's pull request
      # has no secrets and the step prints SKIPPED there only.
      - name: Identity term list
        env:
          TERMS: ${{ secrets.CHORUS_IDENTITY_TERMS_LIST }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ -z "$TERMS" ]; then
            if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "a fork's pull request has no secrets:" \
                "the identity step prints SKIPPED"
              exit 0
            fi
            echo "::error::the CHORUS_IDENTITY_TERMS_LIST secret is empty;" \
              "the identity scan cannot run"
            exit 1
          fi
          f="$RUNNER_TEMP/identity-terms.txt"
          printf '%s\n' "$TERMS" > "$f"
          while IFS= read -r t; do
            if [ -n "$t" ]; then echo "::add-mask::$t"; fi
          done < "$f"
          echo "CHORUS_IDENTITY_TERMS=$f" >> "$GITHUB_ENV"

      - name: make gate-changed
        run: make gate-changed

      - name: Gate logs
        if: failure()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-logs
          path: target/gate/*.log
          retention-days: 7

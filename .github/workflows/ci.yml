name: ci

# Every change. The regressions this repository exists to protect run as
# separately named steps so a red build says which one broke. Any failing step
# fails the build; nothing here is allowed to continue on error.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build the workspace
        run: cargo build --workspace --all-targets --verbose

      - name: Golden-vector round trip
        run: cargo test --package chorus-protocol -- --nocapture

      - name: Simulator regression
        run: cargo test --package chorus-sync -- --nocapture

      # The clock guardrail, and the check that the list it rests on has no
      # hole in it. Includes the two demonstrations that both go red.
      - name: The audio path, and the settable-clock check
        run: cargo test --package chorus-audio-path -- --nocapture

      - name: Chunking, buffering and playout
        run: |
          cargo test --package chorus-audio
          cargo test --package chorus-server
          cargo test --package chorus-client-linux
          cargo test --package chorus-hostctl
          cargo test --package chorus-alsa

      - name: Whole workspace, including documentation examples
        run: cargo test --workspace

      # The ESP32-S3 endpoint. Three separately named steps, because they are
      # three different regressions and a red build should say which one broke.
      # None of them needs an ESP32-S3, an amplifier, ESP-IDF or a sound card:
      # the cores are held to committed fixtures and the amplifier is driven
      # through an injectable transport. What genuinely needs hardware is
      # tools/endpoint-rig-run.sh, which the `make verify` step below runs with
      # its prerequisites absent and watches refuse.
      - name: Endpoint golden-vector round trip
        run: make firmware-golden-vectors

      - name: Endpoint sync-core scenario regression
        run: make firmware-sync-scenarios

      # No eFuse write, no OTA activation, no settable wall clock on the
      # endpoint path, nothing in external RAM, no register address in the
      # amplifier driver, and no unit missing from the list. Includes the eight
      # demonstrations that go red on a smuggled instance.
      - name: Endpoint safety scans
        run: make firmware-safety-scans

      # The rest of it, including the amplifier bring-up order against a
      # simulated part and the rejoin graded over a real socket with a real
      # chorus-server killed and restarted under it. The outage-of-minutes run
      # is real minutes of real wall clock, which is what makes it evidence.
      - name: Endpoint clocking, amplifier, telemetry and the rejoin
        run: make firmware-check

      # Every refusal path, and the proof that a verification whose environment
      # is absent exits non-zero naming what is missing rather than reporting
      # green. This runner has no audio device and no real-time priority, which
      # is exactly the environment that makes the second one meaningful.
      - name: Refusals, and that unrun checks are visibly unrun
        run: make verify
